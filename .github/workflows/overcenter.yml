name: Overcenter governance

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  repository_dispatch:
    types: [overcenter-advance]

permissions:
  contents: read

concurrency:
  group: overcenter-governance-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  overcenter-invocation-pending:
    name: Overcenter awaits explicit rerun
    if: >-
      github.run_attempt == 1 &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       github.event_name == 'repository_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Explain command authorization
        run: |
          echo "Overcenter is not invoked by an initial push or dispatch."
          echo "Explicitly re-run all jobs in this workflow to invoke the pinned command."
          echo "The pinned runtime independently rejects run attempts below 2."
          echo "Initial event is observation, not authority." >> "$GITHUB_STEP_SUMMARY"

  overcenter-advance:
    name: Overcenter project.advance
    if: >-
      github.run_attempt > 1 &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       github.event_name == 'repository_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out exact Azelficoast source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Resolve trusted Overcenter runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          repository="$(python3 -c 'import json; print(json.load(open(".overcenter/runtime.json"))["repository"])')"
          sha="$(python3 -c 'import json; print(json.load(open(".overcenter/runtime.json"))["sha"])')"
          [[ "$repository" =~ ^[^/]+/[^/]+$ ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out exact Overcenter runtime
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.runtime.outputs.repository }}
          ref: ${{ steps.runtime.outputs.sha }}
          path: .overcenter-runtime
          persist-credentials: false
      - name: Use Overcenter pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .overcenter-runtime/.node-version
          package-manager-cache: false
      - name: Advance authoritative project
        id: advance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OVERCENTER_COMMAND_REPOSITORY_ID: ${{ github.repository_id }}
          OVERCENTER_COMMAND_REPOSITORY: ${{ github.repository }}
          OVERCENTER_COMMAND_SOURCE_SHA: ${{ steps.runtime.outputs.sha }}
          OVERCENTER_PROJECT_SOURCE_SHA: ${{ github.sha }}
          OVERCENTER_COMMAND_RUN_ID: ${{ github.run_id }}
          OVERCENTER_COMMAND_RUN_ATTEMPT: ${{ github.run_attempt }}
          OVERCENTER_PROJECT_AUTHORITY_REF: refs/overcenter/state
          OVERCENTER_PROJECT_REMOTE: origin
        run: node --experimental-strip-types .overcenter-runtime/src/cli/project-advance.ts --output-dir overcenter-response
      - name: Publish reasoning work packet
        if: steps.advance.outputs.state == 'AGENT_EXECUTION_REQUIRED'
        uses: actions/upload-artifact@v4
        with:
          name: overcenter-work-packet-${{ steps.advance.outputs.run_id }}
          path: overcenter-response
          if-no-files-found: error
          retention-days: 7

  overcenter-broker:
    name: Overcenter broker source proposal
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'overcenter/proposal/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      PROPOSAL_REF: ${{ github.event.pull_request.head.ref }}
      PROPOSAL_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out trusted project control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Resolve trusted Overcenter runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          repository="$(python3 -c 'import json; print(json.load(open(".overcenter/runtime.json"))["repository"])')"
          sha="$(python3 -c 'import json; print(json.load(open(".overcenter/runtime.json"))["sha"])')"
          [[ "$repository" =~ ^[^/]+/[^/]+$ ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out exact Overcenter runtime
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.runtime.outputs.repository }}
          ref: ${{ steps.runtime.outputs.sha }}
          path: .overcenter-runtime
          persist-credentials: false
      - name: Use Overcenter pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .overcenter-runtime/.node-version
          package-manager-cache: false
      - name: Fetch proposal object without checking it out
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$PROPOSAL_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$PROPOSAL_SHA"
      - name: Broker exact proposal revision
        id: broker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OVERCENTER_PROJECT_AUTHORITY_REF: refs/overcenter/state
          OVERCENTER_PROJECT_REMOTE: origin
        shell: bash
        run: |
          set -euo pipefail
          run_id="${PROPOSAL_REF#overcenter/proposal/}"
          test -n "$run_id"
          test "$run_id" != "$PROPOSAL_REF"
          node --experimental-strip-types .overcenter-runtime/src/cli/source-broker-ref.ts --run-id "$run_id" --proposal-sha "$PROPOSAL_SHA" --output overcenter-broker-receipt.json
      - name: Close consumed proposal PR
        if: steps.broker.outputs.publication_state == 'PUBLISHED' || steps.broker.outputs.publication_state == 'ALREADY_PUBLISHED'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REF: ${{ steps.broker.outputs.candidate_ref }}
        shell: bash
        run: |
          gh pr close "$PR_NUMBER" --comment "Overcenter brokered this proposal into `$CANDIDATE_REF`."
