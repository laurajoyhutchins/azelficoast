name: simulator-class-native-belief-experiment

on:
  pull_request:
    paths:
      - "src/azelficoast/class_native_belief.py"
      - "src/azelficoast/class_native_belief_experiment.py"
      - "tests/test_class_native_belief.py"
      - ".github/workflows/simulator-class-native-belief-experiment.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  class-native-belief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Install simulator dependencies
        run: uv sync --extra simulator

      - name: Fetch pinned Pokémon Showdown
        run: |
          git init /tmp/pokemon-showdown
          git -C /tmp/pokemon-showdown remote add origin https://github.com/smogon/pokemon-showdown.git
          git -C /tmp/pokemon-showdown fetch --depth 1 origin a5df8274e85b0889bf2a9b3422a08b39732374fc
          git -C /tmp/pokemon-showdown checkout --detach FETCH_HEAD

      - name: Build Pokémon Showdown
        working-directory: /tmp/pokemon-showdown
        run: |
          npm ci --omit=optional --no-audit --no-fund
          npm run build

      - name: Generate pinned damage contexts
        run: |
          node scripts/generate_showdown_damage_fixtures.cjs             /tmp/pokemon-showdown             > /tmp/showdown-gen9-damage-fixtures.json

      - name: Test class-native belief machinery
        run: uv run pytest tests/test_class_native_belief.py

      - name: Run class-native belief experiment
        run: |
          uv run python -m azelficoast.class_native_belief_experiment             /tmp/showdown-gen9-damage-fixtures.json             | tee /tmp/class-native-belief-experiment.json

          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/class-native-belief-experiment.json").read_text())
          assert result["passed"] is True, result
          assert result["projection_evidence"]["split_merge_sequence"] == [1, 176, 8, 1408, 1], result
          assert result["projection_evidence"]["damage_projection_exact"] is True, result
          assert result["observation_evidence"]["exact"] is True, result
          assert result["benchmarks"][-1]["logical_world_count"] == 524288, result
          assert result["benchmarks"][-1]["speedup_vs_direct_jax"] > 10.0, result
          assert result["benchmarks"][-1]["speedup_vs_raw_regroup"] > 10.0, result
          assert result["benchmarks"][-1]["missing_attack_modifier_negative_control_detected"] is True, result
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: class-native-belief-evidence
          path: /tmp/class-native-belief-experiment.json
          if-no-files-found: error
