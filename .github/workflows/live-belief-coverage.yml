name: live-belief-coverage

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - ".github/actions/setup-python-environment/action.yml"
      - ".github/actions/setup-showdown/action.yml"
      - "experiments/showdown-revision.txt"
      - "src/azelficoast/belief/coverage.py"
      - "src/azelficoast/live/belief.py"
      - "src/azelficoast/live/harness.py"
      - "src/azelficoast/live/instrumentation.py"
      - "src/azelficoast/research/hosted/**"
      - "tests/test_belief_coverage.py"
      - "tests/test_harness.py"
      - ".github/workflows/live-belief-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-belief-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-environment
      - uses: ./.github/actions/setup-showdown
      - name: Execute hosted research contract
        run: uv run python -m azelficoast.research.hosted live-belief-coverage
      - name: Show local server log on failure
        if: failure()
        run: tail -200 /tmp/showdown.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-belief-coverage
          path: |
            /tmp/belief-coverage.json
            /tmp/decisions.jsonl
            /tmp/results.jsonl
          if-no-files-found: warn
