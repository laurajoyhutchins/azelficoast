name: live-belief-coverage

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - ".github/actions/setup-python-environment/action.yml"
      - "src/azelficoast/belief/coverage.py"
      - "src/azelficoast/live/belief.py"
      - "src/azelficoast/live/**"
      - "src/azelficoast/live/instrumentation.py"
      - "tests/test_belief_coverage.py"
      - "tests/test_harness.py"
      - ".github/workflows/live-belief-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-belief-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Azelficoast Python
        uses: ./.github/actions/setup-python-environment

      - name: Fetch pinned Pokémon Showdown
        run: |
          git init /tmp/pokemon-showdown
          git -C /tmp/pokemon-showdown remote add origin https://github.com/smogon/pokemon-showdown.git
          git -C /tmp/pokemon-showdown fetch --depth 1 origin a5df8274e85b0889bf2a9b3422a08b39732374fc
          git -C /tmp/pokemon-showdown checkout --detach FETCH_HEAD

      - name: Build Pokémon Showdown
        working-directory: /tmp/pokemon-showdown
        run: |
          npm ci --omit=optional --no-audit --no-fund
          cp config/config-example.js config/config.js

      - name: Start local Showdown
        working-directory: /tmp/pokemon-showdown
        run: |
          nohup node pokemon-showdown start --no-security >/tmp/showdown.log 2>&1 &
          python - <<'PY'
          import socket
          import time

          deadline = time.time() + 30
          while time.time() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 8000), timeout=1):
                      break
              except OSError:
                  time.sleep(0.25)
          else:
              raise SystemExit("Showdown did not open port 8000")
          PY

      - name: Generate public decision sample
        run: |
          uv run azelficoast             --results /tmp/results.jsonl             --decisions /tmp/decisions.jsonl             --replays /tmp/replays             local --battles 256 --concurrency 8

      - name: Measure current belief admission coverage
        run: |
          uv run azelficoast belief-coverage /tmp/decisions.jsonl             | tee /tmp/belief-coverage.json

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/belief-coverage.json").read_text())
          observed = report["observed_routing"]
          admission = report["static_admission"]

          assert report["schema"] == "azelficoast.live-belief-coverage", report
          assert report["schema_version"] == 1, report
          assert observed["decision_count"] >= 256, observed
          assert admission["decision_count"] == observed["decision_count"], report
          assert admission["admitted_decision_count"] >= 1, admission
          assert admission["fallback_reason_counts"], admission

          print(json.dumps({
              "decision_count": admission["decision_count"],
              "admitted_decision_count": admission["admitted_decision_count"],
              "admission_rate": admission["admission_rate"],
              "top_fallback_reasons": admission["fallback_reason_counts"][:8],
          }, sort_keys=True))
          PY

      - name: Show local server log on failure
        if: failure()
        run: tail -200 /tmp/showdown.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-belief-coverage
          path: |
            /tmp/belief-coverage.json
            /tmp/decisions.jsonl
            /tmp/results.jsonl
          if-no-files-found: warn
