name: real-belief-survival-witness

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - ".github/actions/setup-python-environment/action.yml"
      - ".github/actions/setup-research-evidence/action.yml"
      - ".github/actions/setup-showdown/action.yml"
      - "experiments/evidence/canonical-evidence.json"
      - "experiments/evidence/canonical-evidence.tar.gz"
      - "experiments/showdown-revision.txt"
      - "src/azelficoast/research/verification/real_belief_trace.py"
      - "src/azelficoast/research/verification/real_belief_miner.py"
      - "src/azelficoast/research/hosted/**"
      - "scripts/probe_real_belief_trace.cjs"
      - ".github/workflows/real-belief-survival-witness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  survival-witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-environment
      - uses: ./.github/actions/setup-research-evidence
      - uses: ./.github/actions/setup-showdown
      - name: Execute hosted research contract
        run: uv run python -m azelficoast.research.hosted real-belief-survival-witness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-belief-survival-witness
          path: |
            /tmp/azelficoast-evidence/survival-source.json
            /tmp/tropius-chiyu-oracle.json
            /tmp/tropius-chiyu-trace.json
            /tmp/tropius-chiyu-mining.json
          if-no-files-found: warn
