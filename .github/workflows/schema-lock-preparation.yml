name: Temporary locked schema dependency derivation
on:
  push:
    branches: [refactor/json-schema-research-contracts]
permissions:
  contents: read
jobs:
  derive-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Resolve canonical pinned uv.lock without committing from CI
        run: |
          python -m pip install uv==0.12.18
          uv lock
          python - <<'PY'
          import json
          from pathlib import Path
          content = Path("uv.lock").read_text(encoding="utf-8")
          for i in range(0, len(content), 1500):
              print("AZELFICOAST_LOCK_CHUNK", i, json.dumps(content[i:i+1500]))
          print("AZELFICOAST_LOCK_COMPLETE", len(content))
          PY
