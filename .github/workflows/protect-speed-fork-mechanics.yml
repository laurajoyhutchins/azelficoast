name: protect-speed-fork-mechanics

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "experiments/protect-speed-forks.json"
      - "experiments/showdown-revision.txt"
      - "scripts/probe_protect_speed_forks.cjs"
      - "src/azelficoast/research/hosted/**"
      - ".github/actions/setup-python-environment/action.yml"
      - ".github/actions/setup-showdown/action.yml"
      - ".github/workflows/protect-speed-fork-mechanics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-environment
      - uses: ./.github/actions/setup-showdown
      - name: Execute hosted research contract
        run: uv run python -m azelficoast.research.hosted protect-speed-fork
      - uses: actions/upload-artifact@v4
        with:
          name: protect-speed-fork-mechanics
          path: /tmp/protect-speed-fork-mechanics.json
          if-no-files-found: error
