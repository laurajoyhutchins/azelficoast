name: stateful-protect-turn-experiment

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - ".github/actions/setup-python-environment/action.yml"
      - "src/azelficoast/stateful_protect_turn.py"
      - "src/azelficoast/stateful_protect_experiment.py"
      - "scripts/generate_showdown_stateful_protect_fixtures.cjs"
      - "tests/test_stateful_protect_turn.py"
      - ".github/workflows/stateful-protect-turn-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stateful-protect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Azelficoast Python
        uses: ./.github/actions/setup-python-environment
        with:
          simulator: "true"

      - name: Restore verified Pokémon Showdown
        uses: ./.github/actions/setup-showdown
        with:
          sha: a5df8274e85b0889bf2a9b3422a08b39732374fc
          path: /tmp/pokemon-showdown
          save-cache: "false"

      - name: Generate exact repeated-Protect fixtures
        run: |
          node scripts/generate_showdown_stateful_protect_fixtures.cjs             /tmp/pokemon-showdown             > /tmp/stateful-protect-fixtures.json

      - name: Test stateful Protect machinery
        run: uv run pytest tests/test_stateful_protect_turn.py

      - name: Run stateful Protect experiment
        run: |
          uv run python -m azelficoast.stateful_protect_experiment             /tmp/stateful-protect-fixtures.json             | tee /tmp/stateful-protect-result.json

          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("/tmp/stateful-protect-result.json").read_text()
          )
          assert result["passed"] is True, result
          assert result["showdown_exact"] is True, result
          assert result["rng_request_shape_exact"] is True, result
          support = result["full_support"]
          assert support["logical_world_count"] == 20412, result
          assert support["execution_class_count"] == 31, result
          assert support["direct_equals_projected"] is True, result
          assert support["reduction_factor"] > 650.0, result
          assert all(
              count == 1
              for count in support["success_class_counts"].values()
          ), result
          assert support["failure_class_counts"]["1"] == 0, result
          assert all(
              support["failure_class_counts"][counter] == 4
              for counter in ("3", "9", "27", "81", "243", "729")
          ), result
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: stateful-protect-evidence
          path: |
            /tmp/stateful-protect-fixtures.json
            /tmp/stateful-protect-result.json
          if-no-files-found: error
