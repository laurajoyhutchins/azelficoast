name: public-belief-exact-corpus

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - ".github/actions/setup-python-environment/action.yml"
      - ".github/actions/setup-research-evidence/action.yml"
      - ".github/actions/setup-showdown/action.yml"
      - "experiments/evidence/canonical-evidence.json"
      - "experiments/evidence/canonical-evidence.tar.gz"
      - "experiments/showdown-revision.txt"
      - "src/azelficoast/research/verification/real_belief_trace.py"
      - "src/azelficoast/research/verification/real_belief_miner.py"
      - "src/azelficoast/core/decision_relevance.py"
      - "src/azelficoast/core/program.py"
      - "src/azelficoast/core/transition.py"
      - "src/azelficoast/core/whole_turn_program.py"
      - "src/azelficoast/research/hosted/**"
      - "scripts/probe_real_belief_trace.cjs"
      - "scripts/real_belief_probe/**"
      - "scripts/json_stream_writer.cjs"
      - "experiments/opponent-policy-semantics.json"
      - "tests/hostile/test_transition_program_hostile.py"
      - ".github/workflows/public-belief-exact-corpus.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-environment
      - name: Resolve code-owned witness matrix
        id: matrix
        run: echo "matrix=$(uv run python -m azelficoast.research.hosted matrix public-belief-exact)" >> "${GITHUB_OUTPUT}"

  exact-candidate:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    name: exact-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-environment
      - uses: ./.github/actions/setup-research-evidence
      - uses: ./.github/actions/setup-showdown
      - name: Execute hosted research contract
        run: uv run python -m azelficoast.research.hosted public-belief-exact "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-public-belief-${{ matrix.name }}
          path: |
            /tmp/candidate-status.json
            /tmp/candidate-source.json
            /tmp/candidate-oracle.json
            /tmp/candidate-lazy-program.json
            /tmp/candidate-trace.json
            /tmp/candidate-mining.json
            /tmp/candidate-result.json
          if-no-files-found: warn
