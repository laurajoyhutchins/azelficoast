name: joint-random-battle-posterior

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "scripts/sample_joint_random_battle_posterior.cjs"
      - "src/azelficoast/joint_posterior.py"
      - "src/azelficoast/belief_evaluator.py"
      - "src/azelficoast/live_belief.py"
      - "tests/test_joint_posterior.py"
      - "tests/test_joint_posterior_sampler.py"
      - "tests/test_belief_evaluator.py"
      - "tests/test_live_belief.py"
      - ".github/workflows/joint-random-battle-posterior.yml"
      - ".github/actions/setup-showdown/action.yml"
      - ".github/actions/setup-research-evidence/action.yml"
      - ".github/actions/setup-python-environment/action.yml"
      - "experiments/evidence/canonical-evidence.json"
      - "experiments/evidence/canonical-evidence.tar.gz"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: joint-random-battle-posterior-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-environment
      - uses: ./.github/actions/setup-research-evidence
      - uses: ./.github/actions/setup-showdown

      - name: Select broadest frozen public-information state
        run: |
          python - <<'PY' > /tmp/joint-source-path
          import json
          from pathlib import Path

          candidates = []
          root = Path("/tmp/azelficoast-evidence")
          for path in root.rglob("*.json"):
              try:
                  document = json.loads(path.read_text())
              except (OSError, json.JSONDecodeError):
                  continue
              if not isinstance(document, dict):
                  continue
              fixture = document.get("fixture", document)
              if not isinstance(fixture, dict):
                  continue
              state = fixture.get("state", {})
              protocol = fixture.get("protocol_prefix", [])
              opponent_team = state.get("opponent_team", {}) if isinstance(state, dict) else {}
              if (
                  fixture.get("fixture_id")
                  and isinstance(protocol, list)
                  and protocol
                  and isinstance(opponent_team, dict)
                  and opponent_team
              ):
                  candidates.append((len(opponent_team), str(path)))

          if not candidates:
              raise SystemExit("canonical evidence has no joint-posterior fixture")
          candidates.sort()
          print(candidates[0][1])
          PY

      - name: Sample joint full-team posterior
        run: |
          source="$(cat /tmp/joint-source-path)"
          node scripts/sample_joint_random_battle_posterior.cjs             /tmp/pokemon-showdown             "$source"             --target-particles 16             --minimum-particles 8             --max-rounds 65536             > /tmp/joint-posterior.json

      - name: Validate atomic posterior
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          from azelficoast.joint_posterior import (
              evaluator_posterior,
              validate_joint_posterior,
          )

          path = Path("/tmp/joint-posterior.json")
          document = json.loads(path.read_text())
          checked = validate_joint_posterior(document)
          projected = evaluator_posterior(checked)

          construction = checked["construction"]
          assert construction["accepted_team_count"] >= 8
          assert construction["preserves_joint_team_set_correlations"] is True
          assert len(projected["worlds"]) >= 1
          assert all(len(world["hidden"]["team"]) == 6 for world in projected["worlds"])
          print(
              "attempted=", construction["attempted_team_count"],
              "accepted=", construction["accepted_team_count"],
              "unique=", construction["unique_particle_count"],
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: joint-random-battle-posterior
          path: /tmp/joint-posterior.json
          if-no-files-found: error
