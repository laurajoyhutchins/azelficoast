name: joint-random-battle-posterior

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "scripts/sample_joint_random_battle_posterior.cjs"
      - "src/azelficoast/belief/joint_posterior.py"
      - "src/azelficoast/belief/validity.py"
      - "src/azelficoast/belief/evaluator.py"
      - "src/azelficoast/live/belief.py"
      - "src/azelficoast/belief/self_improvement.py"
      - "scripts/probe_real_belief_trace.cjs"
      - "tests/test_joint_posterior.py"
      - "tests/test_joint_posterior_sampler.py"
      - "tests/test_belief_evaluator.py"
      - "tests/test_live_belief.py"
      - ".github/workflows/joint-random-battle-posterior.yml"
      - ".github/actions/setup-showdown/action.yml"
      - ".github/actions/setup-research-evidence/action.yml"
      - ".github/actions/setup-python-environment/action.yml"
      - "experiments/evidence/canonical-evidence.json"
      - "experiments/evidence/canonical-evidence.tar.gz"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: joint-random-battle-posterior-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-environment
      - uses: ./.github/actions/setup-research-evidence
      - uses: ./.github/actions/setup-showdown

      - name: Select broadest frozen public-information state
        run: |
          python - <<'PY' > /tmp/joint-source-path
          import json
          from pathlib import Path

          candidates = []
          root = Path("/tmp/azelficoast-evidence")
          for path in root.rglob("*.json"):
              try:
                  document = json.loads(path.read_text())
              except (OSError, json.JSONDecodeError):
                  continue
              if not isinstance(document, dict):
                  continue
              fixture = document.get("fixture", document)
              if not isinstance(fixture, dict):
                  continue
              state = fixture.get("state", {})
              protocol = fixture.get("protocol_prefix", [])
              opponent_team = state.get("opponent_team", {}) if isinstance(state, dict) else {}
              if (
                  fixture.get("fixture_id")
                  and isinstance(protocol, list)
                  and protocol
                  and isinstance(opponent_team, dict)
                  and opponent_team
              ):
                  candidates.append((len(opponent_team), str(path)))

          if not candidates:
              raise SystemExit("canonical evidence has no joint-posterior fixture")
          candidates.sort()
          print(candidates[0][1])
          PY

      - name: Sample joint full-team posterior
        run: |
          source="$(cat /tmp/joint-source-path)"
          echo "fixture=$source"
          set +e
          node scripts/sample_joint_random_battle_posterior.cjs \
            /tmp/pokemon-showdown \
            "$source" \
            --target-particles 16 \
            --minimum-particles 8 \
            --max-rounds 65536 \
            > /tmp/joint-posterior.json
          sampler_status=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("/tmp/joint-posterior.json").read_text())
          c = d["construction"]
          print(
              "support_status=", d["support_status"],
              "attempted=", c["attempted_team_count"],
              "accepted=", c["accepted_team_count"],
              "unique=", c["unique_particle_count"],
              "acceptance_rate=", c["acceptance_rate"],
              "ess=", c["effective_sample_size"],
          )
          print("public_evidence=", json.dumps(d["public_evidence"], sort_keys=True))
          PY
          test "$sampler_status" -eq 0 -o "$sampler_status" -eq 3

      - name: Validate atomic posterior
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          from azelficoast.belief.joint_posterior import (
              evaluator_posterior,
              posterior_validity_record,
              validate_joint_posterior,
          )

          path = Path("/tmp/joint-posterior.json")
          document = json.loads(path.read_text())
          checked = validate_joint_posterior(document)
          projected = evaluator_posterior(checked)
          validity = posterior_validity_record(checked)
          Path("/tmp/joint-posterior-validity.json").write_text(
              json.dumps(validity, sort_keys=True, indent=2) + "\n"
          )

          construction = checked["construction"]
          assert construction["accepted_team_count"] >= 8
          assert construction["preserves_joint_team_set_correlations"] is True
          assert len(projected["worlds"]) >= 1
          assert all(len(world["hidden"]["team"]) == 6 for world in projected["worlds"])
          print(
              "attempted=", construction["attempted_team_count"],
              "accepted=", construction["accepted_team_count"],
              "unique=", construction["unique_particle_count"],
              "support_ess=", validity["support"]["effective_sample_size"],
              "support_entropy_bits=", validity["support"]["entropy_bits"],
          )
          PY

      - name: Prove joint posterior composes with exact teacher mechanics
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          source_path = Path("/tmp/joint-source-path").read_text().strip()
          raw = json.loads(Path(source_path).read_text())
          fixture = raw.get("fixture", raw)
          if not isinstance(fixture, dict) or not fixture.get("fixture_id"):
              raise SystemExit("selected joint fixture is malformed")
          source = (
              dict(raw)
              if raw.get("schema") == "azelficoast.real-belief-source-fixture"
              else {
                  "schema": "azelficoast.real-belief-source-fixture",
                  "schema_version": 1,
                  "fixture_id": fixture["fixture_id"],
                  "showdown_commit": "a5df8274e85b0889bf2a9b3422a08b39732374fc",
                  "fixture": fixture,
              }
          )
          source["joint_opponent_posterior"] = json.loads(
              Path("/tmp/joint-posterior.json").read_text()
          )
          Path("/tmp/joint-teacher-source.json").write_text(
              json.dumps(source, sort_keys=True) + "\n"
          )
          PY

          node scripts/probe_real_belief_trace.cjs             /tmp/pokemon-showdown             /tmp/joint-teacher-source.json             --posterior-only             > /tmp/joint-teacher-posterior.json

          node scripts/probe_real_belief_trace.cjs             /tmp/pokemon-showdown             /tmp/joint-teacher-source.json             --transition-program-only             > /tmp/joint-teacher-program.json

          uv run python - <<'PY'
          import json
          from pathlib import Path

          posterior = json.loads(Path("/tmp/joint-teacher-posterior.json").read_text())
          program = json.loads(Path("/tmp/joint-teacher-program.json").read_text())

          assert posterior["treatment"] in {
              "generator_faithful_joint_empirical",
              "practical_joint_completion",
          }
          assert posterior["reconstruction"]["kind"] == "joint-team-particles-with-dynamic-hp"
          assert posterior["reconstruction"]["preserves_joint_team_set_correlations"] is True
          assert posterior["worlds"]
          assert all(
              isinstance(world["hidden"].get("opponent.bench"), list)
              and world["hidden"]["opponent.bench"]
              for world in posterior["worlds"]
          )
          assert "opponent.bench" in program["dependency_candidates"]
          assert set(program["world_ids"]) == {
              world["world_id"] for world in posterior["worlds"]
          }
          print(
              "treatment=", posterior["treatment"],
              "worlds=", len(posterior["worlds"]),
              "programs=", len(program["programs"]),
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: joint-random-battle-posterior
          path: |
            /tmp/joint-posterior.json
            /tmp/joint-posterior-validity.json
            /tmp/joint-teacher-posterior.json
            /tmp/joint-teacher-program.json
          if-no-files-found: error
