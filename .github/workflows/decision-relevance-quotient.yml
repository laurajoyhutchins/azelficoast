name: decision-relevance-quotient

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "experiments/opponent-policy-semantics.json"
      - ".github/actions/setup-python-environment/action.yml"
      - ".github/actions/setup-research-evidence/action.yml"
      - ".github/actions/setup-showdown/action.yml"
      - "showdown/revision.json"
      - "experiments/evidence/canonical-evidence.json"
      - "experiments/evidence/canonical-evidence.tar.gz"
      - "experiments/real-belief-source-tinkaton-zapdosgalar-mid.json"
      - "showdown/runtime/probe_real_belief_trace.cjs"
      - "showdown/runtime/real_belief_probe/**"
      - "src/azelficoast/core/decision_relevance.py"
      - "src/azelficoast/research/verification/real_belief_trace.py"
      - "src/azelficoast/live/belief.py"
      - "tests/test_decision_relevance.py"
      - "tests/test_live_belief.py"
      - ".github/workflows/decision-relevance-quotient.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decision-relevance-quotient-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quotient:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Azelficoast Python
        uses: ./.github/actions/setup-python-environment

      - name: Unit tests
        run: |
          uv run pytest             tests/test_decision_relevance.py             tests/test_live_belief.py

      - name: Setup canonical research evidence
        uses: ./.github/actions/setup-research-evidence

      - name: Restore verified pinned Pokémon Showdown
        uses: ./.github/actions/setup-showdown

      - name: Rebuild exact natural oracles
        run: |
          node showdown/runtime/probe_real_belief_trace.cjs \
            /tmp/pokemon-showdown \
            /tmp/azelficoast-evidence/status-source.json \
            > /tmp/status-oracle.json

          node showdown/runtime/probe_real_belief_trace.cjs \
            /tmp/pokemon-showdown \
            experiments/real-belief-source-tinkaton-zapdosgalar-mid.json \
            > /tmp/fusion-oracle.json

      - name: Analyze exact quotients
        run: |
          uv run python -m azelficoast.research.verification.real_belief_trace             /tmp/status-oracle.json --quotient             > /tmp/status-quotient.json

          uv run python -m azelficoast.research.verification.real_belief_trace             /tmp/fusion-oracle.json --quotient             > /tmp/fusion-quotient.json

          uv run python -m azelficoast.research.verification.real_belief_trace             /tmp/status-oracle.json             > /tmp/status-full.json

          uv run python -m azelficoast.research.verification.real_belief_trace             /tmp/fusion-oracle.json             > /tmp/fusion-full.json

      - name: Verify exact equivalence and preregistered reductions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text())

          def assert_same_policy(full, quotient):
              qtrace = quotient["quotient_trace"]
              assert qtrace["public_belief"]["chosen_action"] == full["public_belief"]["chosen_action"]
              assert qtrace["determinization"]["chosen_action"] == full["determinization"]["chosen_action"]
              assert qtrace["policy_disagreement"] == full["policy_disagreement"]
              assert (
                  qtrace["strategy_fusion_observation_count"]
                  == full["strategy_fusion_observation_count"]
              )
              for policy in ("public_belief", "determinization"):
                  left = full[policy]["root_values"]
                  right = qtrace[policy]["root_values"]
                  assert left.keys() == right.keys()
                  assert all(abs(left[action] - right[action]) <= 1e-12 for action in left)

          status = load("/tmp/status-quotient.json")
          status_full = load("/tmp/status-full.json")
          fusion = load("/tmp/fusion-quotient.json")
          fusion_full = load("/tmp/fusion-full.json")

          assert_same_policy(status_full, status)
          assert_same_policy(fusion_full, fusion)

          status_cert = status["certificate"]
          fusion_cert = fusion["certificate"]

          assert status_cert["worlds_in"] == 18
          assert status_cert["classes_out"] == 3
          assert status_cert["decision_fields"] == ["opponent.active.exact_hp"]
          assert status_cert["belief_branching_required"] is True

          assert fusion_cert["worlds_in"] == 18
          assert fusion_cert["classes_out"] == 6
          assert fusion_cert["decision_fields"] == [
              "opponent.active.item",
              "opponent.active.exact_hp",
          ]
          assert fusion_cert["belief_branching_required"] is True

          assert fusion_full["strategy_fusion_observation_count"] > 0
          assert "opponent.active.item" in fusion_cert["decision_fields"]
          assert "opponent.active.item" not in status_cert["decision_fields"]

          summary = {
              "status_move": {
                  "source_worlds": status_cert["worlds_in"],
                  "decision_classes": status_cert["classes_out"],
                  "reduction_fraction": status_cert["reduction_fraction"],
                  "decision_fields": status_cert["decision_fields"],
                  "public_action": status_full["public_belief"]["chosen_action"],
              },
              "strategy_fusion": {
                  "source_worlds": fusion_cert["worlds_in"],
                  "decision_classes": fusion_cert["classes_out"],
                  "reduction_fraction": fusion_cert["reduction_fraction"],
                  "decision_fields": fusion_cert["decision_fields"],
                  "strategy_fusion_observation_count": fusion_full[
                      "strategy_fusion_observation_count"
                  ],
                  "public_action": fusion_full["public_belief"]["chosen_action"],
              },
          }
          Path("/tmp/decision-relevance-summary.json").write_text(
              json.dumps(summary, sort_keys=True, indent=2) + "\n"
          )
          print(json.dumps(summary, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decision-relevance-quotient
          path: |
            /tmp/status-quotient.json
            /tmp/fusion-quotient.json
            /tmp/status-full.json
            /tmp/fusion-full.json
            /tmp/decision-relevance-summary.json
          if-no-files-found: warn
