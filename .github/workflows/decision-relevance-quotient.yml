name: decision-relevance-quotient

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - ".github/actions/setup-python-environment/action.yml"
      - ".github/actions/setup-research-evidence/action.yml"
      - ".github/actions/setup-showdown/action.yml"
      - "experiments/evidence/canonical-evidence.json"
      - "experiments/evidence/canonical-evidence.tar.gz"
      - "experiments/real-belief-source-tinkaton-zapdosgalar-mid.json"
      - "experiments/showdown-revision.txt"
      - "scripts/probe_real_belief_trace.cjs"
      - "src/azelficoast/core/decision_relevance.py"
      - "src/azelficoast/research/verification/real_belief_trace.py"
      - "src/azelficoast/live/belief.py"
      - "src/azelficoast/research/hosted/**"
      - "tests/test_decision_relevance.py"
      - "tests/test_live_belief.py"
      - ".github/workflows/decision-relevance-quotient.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decision-relevance-quotient-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quotient:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-environment
      - name: Unit tests
        run: uv run pytest tests/test_decision_relevance.py tests/test_live_belief.py
      - uses: ./.github/actions/setup-research-evidence
      - uses: ./.github/actions/setup-showdown
      - name: Execute hosted research contract
        run: uv run python -m azelficoast.research.hosted decision-relevance-quotient
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decision-relevance-quotient
          path: |
            /tmp/status-quotient.json
            /tmp/fusion-quotient.json
            /tmp/status-full.json
            /tmp/fusion-full.json
            /tmp/decision-relevance-summary.json
          if-no-files-found: warn
