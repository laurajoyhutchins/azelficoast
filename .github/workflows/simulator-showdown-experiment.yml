name: simulator-showdown-experiment

on:
  pull_request:
    paths:
      - "src/azelficoast/simulator_ir.py"
      - "src/azelficoast/showdown_transition_corpus.py"
      - "scripts/generate_showdown_transition_fixtures.cjs"
      - "tests/test_showdown_transition_corpus.py"
      - ".github/workflows/simulator-showdown-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  showdown-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Install Azelficoast
        run: uv sync

      - name: Fetch pinned Pokémon Showdown
        run: |
          git init /tmp/pokemon-showdown
          git -C /tmp/pokemon-showdown remote add origin https://github.com/smogon/pokemon-showdown.git
          git -C /tmp/pokemon-showdown fetch --depth 1 origin a5df8274e85b0889bf2a9b3422a08b39732374fc
          git -C /tmp/pokemon-showdown checkout --detach FETCH_HEAD

      - name: Build Pokémon Showdown
        working-directory: /tmp/pokemon-showdown
        run: npm ci --omit=optional --no-audit --no-fund

      - name: Generate Showdown transition fixtures
        run: |
          node scripts/generate_showdown_transition_fixtures.cjs             /tmp/pokemon-showdown             > /tmp/showdown-transition-fixtures.json

      - name: Verify dependency classes against Showdown
        run: |
          uv run python -m azelficoast.showdown_transition_corpus             /tmp/showdown-transition-fixtures.json             > /tmp/showdown-transition-analysis.json

          cat /tmp/showdown-transition-analysis.json

          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("/tmp/showdown-transition-analysis.json").read_text()
          )
          assert result["passed"] is True, result
          assert result["fixture_count"] == 256, result
          assert result["protect"]["dependency_classes"] == 8, result
          assert result["damage"]["dependency_classes"] == 16, result
          assert result["missing_item_negative_control_detected"] is True, result
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: showdown-transition-dependency-evidence
          path: |
            /tmp/showdown-transition-fixtures.json
            /tmp/showdown-transition-analysis.json
          if-no-files-found: error
