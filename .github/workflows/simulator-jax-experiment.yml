name: simulator-jax-experiment

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/azelficoast/simulator_ir.py"
      - "src/azelficoast/jax_simulator.py"
      - "src/azelficoast/jax_simulator_experiment.py"
      - "tests/test_jax_simulator.py"
      - ".github/workflows/simulator-jax-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jax-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.12.18

      - name: Install simulator dependencies
        run: uv sync --locked --extra simulator

      - name: JAX correctness tests
        run: uv run pytest tests/test_jax_simulator.py

      - name: Run JAX simulator experiment
        run: |
          uv run python -m azelficoast.jax_simulator_experiment             | tee /tmp/jax-simulator-experiment.json

          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/jax-simulator-experiment.json").read_text())
          assert result["passed"] is True, result
          assert result["correctness"]["protect_exact"] is True, result
          assert result["correctness"]["damage_exact"] is True, result
          assert result["benchmarks"][-1]["world_count"] == 524288, result
          assert result["benchmarks"][-1]["damage"]["logical_speedup"] > 1.0, result
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: jax-simulator-evidence
          path: /tmp/jax-simulator-experiment.json
          if-no-files-found: error
