name: replay-world-experiment

on:
  pull_request:
    paths:
      - "src/azelficoast/replay_worlds.py"
      - "scripts/sample_showdown_worlds.cjs"
      - "tests/test_replay_worlds.py"
      - ".github/workflows/replay-world-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Install Azelficoast
        run: uv sync

      - name: Fetch historical Pokémon Showdown
        run: |
          git init /tmp/pokemon-showdown
          git -C /tmp/pokemon-showdown remote add origin https://github.com/smogon/pokemon-showdown.git
          git -C /tmp/pokemon-showdown fetch --depth 1 origin 6397bfddb3db4e916dd792e03c43355f7366e8ab
          git -C /tmp/pokemon-showdown checkout --detach FETCH_HEAD

      - name: Build historical Pokémon Showdown
        working-directory: /tmp/pokemon-showdown
        run: npm ci --omit=optional --no-audit --no-fund

      - name: Sample worlds after Close Combat reveal
        run: |
          node scripts/sample_showdown_worlds.cjs \
            /tmp/pokemon-showdown infernape closecombat 65536 \
            > /tmp/infernape-closecombat.json
          cat /tmp/infernape-closecombat.json

      - name: Reconstruct item belief from public replay
        run: |
          uv run python -m azelficoast.replay_worlds \
            --world-sample /tmp/infernape-closecombat.json \
            > /tmp/infernape-belief.json
          cat /tmp/infernape-belief.json

          uv run python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/infernape-belief.json").read_text())
          assert result["damage_observation"]["damage"] == 54, result
          assert result["damage_observation"]["target_tera_type"] == "Flying", result
          assert result["generator_prior"] == {
              "Choice Band": 16086 / 65536,
              "Choice Scarf": 7944 / 65536,
              "Life Orb": 41506 / 65536,
          }, result
          assert result["public_history_updates"] == [{
              "turn": 18,
              "kind": "life-orb-recoil",
              "observed": False,
              "authority": "complete-public-turn",
              "remaining_items": ["Choice Band", "Choice Scarf"],
          }], result
          assert result["prior"] == {
              "Choice Band": 16086 / (16086 + 7944),
              "Choice Scarf": 7944 / (16086 + 7944),
          }, result
          assert result["compatible_worlds"]["Choice Scarf"]["matching_rolls"] == 3, result
          assert result["posterior"] == {"Choice Scarf": 1.0}, result
          assert result["showdown_commit"] == "6397bfddb3db4e916dd792e03c43355f7366e8ab", result
          assert result["sample"]["showdown_commit"] == result["showdown_commit"], result
          assert len(result["belief_sha256"]) == 64, result
          PY

      - name: Later-move prior control
        run: |
          node scripts/sample_showdown_worlds.cjs \
            /tmp/pokemon-showdown infernape closecombat,flareblitz 65536 \
            > /tmp/infernape-closecombat-flareblitz.json
          uv run python - <<'PY'
          import json
          from pathlib import Path

          sample = json.loads(
              Path("/tmp/infernape-closecombat-flareblitz.json").read_text()
          )
          assert sample["matched"] > 0, sample
          assert set(sample["item_counts"]) == {
              "Choice Band",
              "Choice Scarf",
              "Life Orb",
          }, sample
          PY
