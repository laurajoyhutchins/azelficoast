name: replay-world-experiment

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - ".github/actions/setup-python-environment/action.yml"
      - "src/azelficoast/research/verification/replay_worlds.py"
      - "src/azelficoast/research/hosted/**"
      - "scripts/sample_showdown_worlds.cjs"
      - "tests/test_replay_worlds.py"
      - ".github/workflows/replay-world-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-environment
      - name: Execute hosted research contract
        run: uv run python -m azelficoast.research.hosted replay-world
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-world-evidence
          path: |
            /tmp/infernape-closecombat.json
            /tmp/infernape-belief.json
            /tmp/infernape-closecombat-flareblitz.json
          if-no-files-found: warn
