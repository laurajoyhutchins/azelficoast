name: posterior-study-smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".python-version"
      - ".github/actions/setup-python-environment/action.yml"
      - ".github/actions/setup-showdown/action.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/posterior-study-smoke.yml"
      - "tools/smoke_posterior_study.py"
      - "tests/test_posterior_smoke.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: posterior-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded:
    name: bounded smoke (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [quick, mid-seed-1, mid-seed-2]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-python-environment
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: ./.github/actions/setup-showdown
      - name: Exercise pinned source + bounded generator + conditional mechanics screen
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          uv run python tools/smoke_posterior_study.py \
            --profile "${{ matrix.profile }}" \
            --output "/tmp/posterior-smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: posterior-smoke-${{ matrix.profile }}
          path: /tmp/posterior-smoke
          if-no-files-found: error
