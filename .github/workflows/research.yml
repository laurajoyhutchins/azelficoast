name: research

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".python-version"
      - ".github/actions/**"
      - ".github/actions/setup-python-environment/action.yml"
      - ".github/workflows/research.yml"
      - "experiments/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "src/**"
      - "showdown/**"
      - "tests/**"
  push:
    branches:
      - 'overcenter/candidate/**'
      - 'operator/research-dispatch'
  workflow_dispatch:
    inputs:
      candidate:
        description: Candidate experiment name, or all
        required: false
        default: all
        type: string
      study:
        description: Hosted research study name, or all
        required: false
        default: all
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: research-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  operator-dispatch:
    if: github.event_name == 'push' && github.ref_name == 'operator/research-dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Dispatch exact research request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          request=".github/research-dispatch.json"
          if [[ ! -f "$request" ]]; then
            echo "no research dispatch request"
            exit 0
          fi

          schema="$(jq -r '.schema' "$request")"
          pr_number="$(jq -r '.pr' "$request")"
          ref="$(jq -r '.ref' "$request")"
          expected_sha="$(jq -r '.sha' "$request")"
          study="$(jq -r '.study' "$request")"
          candidate="$(jq -r '.candidate' "$request")"

          test "$schema" = "azelficoast.research-dispatch/v1"
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
          test -n "$ref"
          test -n "$study"
          test -n "$candidate"

          pull="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}")"
          actual_repo="$(jq -r '.head.repo.full_name' <<<"$pull")"
          actual_ref="$(jq -r '.head.ref' <<<"$pull")"
          actual_sha="$(jq -r '.head.sha' <<<"$pull")"

          test "$actual_repo" = "$REPOSITORY"
          test "$actual_ref" = "$ref"
          test "$actual_sha" = "$expected_sha"

          jq -n \
            --arg ref "$ref" \
            --arg study "$study" \
            --arg candidate "$candidate" \
            '{ref: $ref, inputs: {study: $study, candidate: $candidate}}' \
            > /tmp/research-dispatch.json

          gh api \
            --method POST \
            "repos/${REPOSITORY}/actions/workflows/research.yml/dispatches" \
            --input /tmp/research-dispatch.json

  candidate-plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       startsWith(github.ref_name, 'overcenter/candidate/')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       !startsWith(github.head_ref, 'overcenter/proposal/'))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup Azelficoast Python
        uses: ./.github/actions/setup-python-environment
      - name: Select affected candidate experiments
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUESTED: ${{ inputs.candidate }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            matrix="$(uv run python -m azelficoast.research.ci plan --requested "${REQUESTED:-all}")"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base_sha="$(git rev-parse "${HEAD_SHA}^")"
            matrix="$(uv run python -m azelficoast.research.ci plan --base "${base_sha}" --head "${HEAD_SHA}")"
          else
            matrix="$(uv run python -m azelficoast.research.ci plan --base "${BASE_SHA}" --head "${HEAD_SHA}")"
          fi
          count="$(uv run python -c 'import json,sys; print(len(json.loads(sys.argv[1])["include"]))' "${matrix}")"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"

  accelerator-static:
    needs: candidate-plan
    if: needs.candidate-plan.result == 'success'
    name: strict accelerator typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Azelficoast simulator Python
        uses: ./.github/actions/setup-python-environment
        with:
          simulator: true
      - name: Type check accelerator frontier
        run: |
          uv run mypy \
            src/azelficoast/core/compiled_search.py \
            src/azelficoast/belief/showdown_packing.py \
            src/azelficoast/belief/packed_evaluator.py \
            src/azelficoast/belief/compiled_search.py

  candidate-exact:
    needs: candidate-plan
    if: needs.candidate-plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.candidate-plan.outputs.matrix) }}
    name: candidate (${{ matrix.experiment }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Azelficoast Python
        uses: ./.github/actions/setup-python-environment
        with:
          simulator: ${{ matrix.simulator }}
      - name: Restore verified pinned Pokémon Showdown
        if: matrix.showdown == true
        uses: ./.github/actions/setup-showdown
      - name: Execute and settle candidate evidence
        env:
          AZELFICOAST_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: uv run python -m azelficoast.research.ci run "${{ matrix.experiment }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: /tmp/azelficoast-research/${{ matrix.experiment }}
          if-no-files-found: error

  candidate-certify:
    needs: [candidate-plan, candidate-exact, accelerator-static]
    if: always() && needs.candidate-plan.result == 'success'
    name: certify candidate exact head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Azelficoast Python
        uses: ./.github/actions/setup-python-environment
      - name: Validate and emit exact-head certificate
        env:
          SELECTED_COUNT: ${{ needs.candidate-plan.outputs.count }}
          EXACT_RESULT: ${{ needs.candidate-exact.result }}
          ACCELERATOR_STATIC_RESULT: ${{ needs.accelerator-static.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MATRIX: ${{ needs.candidate-plan.outputs.matrix }}
        run: uv run python -m azelficoast.research.ci certify
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-research-certificate
          path: /tmp/candidate-research-certificate/certificate.json
          if-no-files-found: error

  hosted-plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    outputs:
      prepare_matrix: ${{ steps.plan.outputs.prepare_matrix }}
      prepare_count: ${{ steps.plan.outputs.prepare_count }}
      run_matrix: ${{ steps.plan.outputs.run_matrix }}
      run_count: ${{ steps.plan.outputs.run_count }}
      aggregate_matrix: ${{ steps.plan.outputs.aggregate_matrix }}
      aggregate_count: ${{ steps.plan.outputs.aggregate_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup Azelficoast Python
        uses: ./.github/actions/setup-python-environment
      - name: Select affected hosted research
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUESTED: ${{ inputs.study }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            plan="$(uv run python -m azelficoast.research.hosted plan --requested "${REQUESTED:-all}")"
          else
            plan="$(uv run python -m azelficoast.research.hosted plan --base "${BASE_SHA}" --head "${HEAD_SHA}")"
          fi
          prepare_matrix="$(uv run python -c 'import json,sys; print(json.dumps(json.loads(sys.argv[1])["prepare"], separators=(",",":")))' "${plan}")"
          run_matrix="$(uv run python -c 'import json,sys; print(json.dumps(json.loads(sys.argv[1])["run"], separators=(",",":")))' "${plan}")"
          aggregate_matrix="$(uv run python -c 'import json,sys; print(json.dumps(json.loads(sys.argv[1])["aggregate"], separators=(",",":")))' "${plan}")"
          prepare_count="$(uv run python -c 'import json,sys; print(len(json.loads(sys.argv[1])["include"]))' "${prepare_matrix}")"
          run_count="$(uv run python -c 'import json,sys; print(len(json.loads(sys.argv[1])["include"]))' "${run_matrix}")"
          aggregate_count="$(uv run python -c 'import json,sys; print(len(json.loads(sys.argv[1])["include"]))' "${aggregate_matrix}")"
          echo "prepare_matrix=${prepare_matrix}" >> "${GITHUB_OUTPUT}"
          echo "prepare_count=${prepare_count}" >> "${GITHUB_OUTPUT}"
          echo "run_matrix=${run_matrix}" >> "${GITHUB_OUTPUT}"
          echo "run_count=${run_count}" >> "${GITHUB_OUTPUT}"
          echo "aggregate_matrix=${aggregate_matrix}" >> "${GITHUB_OUTPUT}"
          echo "aggregate_count=${aggregate_count}" >> "${GITHUB_OUTPUT}"

  hosted-prepare:
    needs: hosted-plan
    if: needs.hosted-plan.outputs.prepare_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.hosted-plan.outputs.prepare_matrix) }}
    name: prepare (${{ matrix.study }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-python-environment
      - name: Setup canonical research evidence
        if: matrix.evidence == true
        uses: ./.github/actions/setup-research-evidence
      - name: Restore verified pinned Pokémon Showdown
        if: matrix.showdown == true
        uses: ./.github/actions/setup-showdown
      - name: Prepare hosted research inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m azelficoast.research.hosted prepare-run "${{ matrix.study }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: ${{ matrix.if_no_files }}

  hosted-run:
    needs: [hosted-plan, hosted-prepare]
    if: always() && needs.hosted-plan.result == 'success' && needs.hosted-plan.outputs.run_count != '0' && needs.hosted-prepare.result != 'failure' && needs.hosted-prepare.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.hosted-plan.outputs.run_matrix) }}
    name: hosted (${{ matrix.study }} / ${{ matrix.unit }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-python-environment
      - name: Setup canonical research evidence
        if: matrix.evidence == true
        uses: ./.github/actions/setup-research-evidence
      - name: Restore verified pinned Pokémon Showdown
        if: matrix.showdown == true
        uses: ./.github/actions/setup-showdown
      - uses: actions/download-artifact@v4
        if: matrix.prepare_artifact_name != ''
        with:
          name: ${{ matrix.prepare_artifact_name }}
          path: /tmp/hosted-preparation
      - name: Execute hosted research unit
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m azelficoast.research.hosted run-unit "${{ matrix.study }}" "${{ matrix.unit }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: ${{ matrix.if_no_files }}

  hosted-aggregate:
    needs: [hosted-plan, hosted-prepare, hosted-run]
    if: always() && needs.hosted-plan.result == 'success' && needs.hosted-plan.outputs.aggregate_count != '0' && needs.hosted-prepare.result != 'failure' && needs.hosted-prepare.result != 'cancelled' && needs.hosted-run.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.hosted-plan.outputs.aggregate_matrix) }}
    name: aggregate (${{ matrix.study }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-python-environment
      - name: Setup canonical research evidence
        if: matrix.evidence == true
        uses: ./.github/actions/setup-research-evidence
      - name: Restore verified pinned Pokémon Showdown
        if: matrix.showdown == true
        uses: ./.github/actions/setup-showdown
      - uses: actions/download-artifact@v4
        if: matrix.prepare_artifact_name != ''
        with:
          name: ${{ matrix.prepare_artifact_name }}
          path: /tmp/hosted-preparation
      - name: Prepare aggregate inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m azelficoast.research.hosted prepare-aggregate "${{ matrix.study }}"
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.download_pattern }}
          path: /tmp/exact
          merge-multiple: true
      - name: Aggregate hosted research evidence
        run: uv run python -m azelficoast.research.hosted aggregate "${{ matrix.study }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: ${{ matrix.if_no_files }}

  overcenter-settle:
    name: Overcenter project.submit
    needs: [candidate-certify]
    if: >-
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref_name, 'overcenter/candidate/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      RESEARCH_RESULT: ${{ needs.candidate-certify.result }}
    steps:
      - name: Check out exact canonical candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Wait for ordinary CI evidence
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          conclusion="missing"
          for _ in {1..60}; do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20")"
            conclusion="$(jq -r --arg sha "$GITHUB_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha)]
              | sort_by(.run_number)
              | last
              | if . == null then "missing"
                elif .status != "completed" then "pending"
                else (.conclusion // "unknown")
                end
            ' <<<"$runs")"
            if [[ "$conclusion" != "missing" && "$conclusion" != "pending" ]]; then
              break
            fi
            sleep 5
          done
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
      - name: Record exact verification result
        id: verification
        env:
          CI_RESULT: ${{ steps.ci.outputs.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="${GITHUB_REF_NAME#overcenter/candidate/}"
          test -n "$run_id"
          test "$run_id" != "$GITHUB_REF_NAME"
          read -r commit parent extra < <(git rev-list --parents -n1 "$GITHUB_SHA")
          test "$commit" = "$GITHUB_SHA"
          test -n "$parent"
          test -z "${extra:-}"
          if [[ "$RESEARCH_RESULT" == "success" && "$CI_RESULT" == "success" ]]; then
            state="verified"
            reason=""
            tree_sha="$(git rev-parse "$GITHUB_SHA^{tree}")"
          else
            state="rejected"
            reason="AZELFICOAST_CANDIDATE_VERIFICATION_FAILED"
            tree_sha=""
          fi
          mkdir -p overcenter-verification
          jq -n \
            --arg state "$state" \
            --arg run_id "$run_id" \
            --arg candidate_sha "$GITHUB_SHA" \
            --arg base_sha "$parent" \
            --arg tree_sha "$tree_sha" \
            --arg reason "$reason" \
            '{
              schema: "overcenter-source-verification/v1",
              state: $state,
              run_id: $run_id,
              candidate_sha: $candidate_sha,
              base_sha: $base_sha,
              tree_sha: (if $tree_sha == "" then null else $tree_sha end),
              reason: (if $reason == "" then null else $reason end)
            }' > overcenter-verification/source-verification.json
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Resolve trusted Overcenter runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          repository="$(python3 -c 'import json; print(json.load(open(".overcenter/runtime.json"))["repository"])')"
          sha="$(python3 -c 'import json; print(json.load(open(".overcenter/runtime.json"))["sha"])')"
          [[ "$repository" =~ ^[^/]+/[^/]+$ ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out exact Overcenter runtime
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.runtime.outputs.repository }}
          ref: ${{ steps.runtime.outputs.sha }}
          path: .overcenter-runtime
          persist-credentials: false
      - name: Use Overcenter pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .overcenter-runtime/.node-version
          package-manager-cache: false
      - name: Settle exact candidate
        id: submit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OVERCENTER_COMMAND_REPOSITORY_ID: ${{ github.repository_id }}
          OVERCENTER_COMMAND_REPOSITORY: ${{ github.repository }}
          OVERCENTER_COMMAND_SOURCE_SHA: ${{ steps.runtime.outputs.sha }}
          OVERCENTER_COMMAND_RUN_ID: ${{ github.run_id }}
          OVERCENTER_COMMAND_RUN_ATTEMPT: ${{ github.run_attempt }}
          OVERCENTER_CANDIDATE_SHA: ${{ github.sha }}
          OVERCENTER_CANDIDATE_RUN_ID: ${{ steps.verification.outputs.run_id }}
          OVERCENTER_SOURCE_VERIFICATION_PATH: ${{ github.workspace }}/overcenter-verification/source-verification.json
          OVERCENTER_PROJECT_AUTHORITY_REF: refs/overcenter/state
          OVERCENTER_PROJECT_REMOTE: origin
        run: |
          mkdir -p overcenter-submit
          node --experimental-strip-types \
            .overcenter-runtime/src/cli/project-submit.ts \
            --receipt overcenter-submit/receipt.json
      - name: Publish settlement receipt
        uses: actions/upload-artifact@v4
        with:
          name: overcenter-project-submit-${{ steps.verification.outputs.run_id }}
          path: overcenter-submit/receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Re-enter project loop after rejected candidate
        if: steps.submit.outputs.disposition == 'READY'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/dispatches" \
            -f event_type=overcenter-advance

  mesprit-regression-canary:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 218
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Azelficoast Python
        uses: ./.github/actions/setup-python-environment
      - name: Setup pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Setup verified Pokémon Showdown
        uses: ./.github/actions/setup-showdown
      - name: Restore archived failing Mesprit evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mesprit-canary-input
          gh run download 37713372447 \
            --name training-run-37713372447 \
            --dir /tmp/mesprit-canary-input
      - name: Check Mesprit against trusted transition verifier
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          uv run python tools/canary_mesprit.py \
            --artifact-dir /tmp/mesprit-canary-input \
            --showdown-root /tmp/pokemon-showdown \
            --receipt /tmp/mesprit-canary-receipt/receipt.json
      - name: Upload exact-head Mesprit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesprit-regression-canary
          path: /tmp/mesprit-canary-receipt/receipt.json
          if-no-files-found: warn
          retention-days: 30
