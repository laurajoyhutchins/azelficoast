name: research

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".python-version"
      - ".github/actions/**"
      - ".github/actions/setup-python-environment/action.yml"
      - ".github/workflows/research.yml"
      - "experiments/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "src/**"
      - "showdown/**"
      - "tests/**"
  push:
    branches:
      - 'overcenter/candidate/**'
      - 'operator/research-dispatch'
  workflow_dispatch:
    inputs:
      candidate:
        description: Candidate experiment name, or all
        required: false
        default: all
        type: string
      study:
        description: Hosted research study name, or all
        required: false
        default: all
        type: string
      posterior_population_acquisition:
        description: Generate and validate a fresh issue #69 source corpus only
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: research-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  operator-dispatch:
    if: github.event_name == 'push' && github.ref_name == 'operator/research-dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Dispatch exact research request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          request=".github/research-dispatch.json"
          if [[ ! -f "$request" ]]; then
            echo "no research dispatch request"
            exit 0
          fi

          schema="$(jq -r '.schema' "$request")"
          pr_number="$(jq -r '.pr' "$request")"
          ref="$(jq -r '.ref' "$request")"
          expected_sha="$(jq -r '.sha' "$request")"
          study="$(jq -r '.study' "$request")"
          candidate="$(jq -r '.candidate' "$request")"

          test "$schema" = "azelficoast.research-dispatch/v1"
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
          test -n "$ref"
          test -n "$study"
          test -n "$candidate"

          pull="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}")"
          actual_repo="$(jq -r '.head.repo.full_name' <<<"$pull")"
          actual_ref="$(jq -r '.head.ref' <<<"$pull")"
          actual_sha="$(jq -r '.head.sha' <<<"$pull")"

          test "$actual_repo" = "$REPOSITORY"
          test "$actual_ref" = "$ref"
          test "$actual_sha" = "$expected_sha"

          jq -n \
            --arg ref "$ref" \
            --arg study "$study" \
            --arg candidate "$candidate" \
            '{ref: $ref, inputs: {study: $study, candidate: $candidate}}' \
            > /tmp/research-dispatch.json

          gh api \
            --method POST \
            "repos/${REPOSITORY}/actions/workflows/research.yml/dispatches" \
            --input /tmp/research-dispatch.json

  candidate-plan:
    if: >-
      inputs.posterior_population_acquisition != true &&
      (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       startsWith(github.ref_name, 'overcenter/candidate/')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       !startsWith(github.head_ref, 'overcenter/proposal/'))
      )
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup Azelficoast Python
        uses: ./.github/actions/setup-python-environment
      - name: Select affected candidate experiments
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUESTED: ${{ inputs.candidate }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            matrix="$(uv run python -m azelficoast.research.ci plan --requested "${REQUESTED:-all}")"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base_sha="$(git rev-parse "${HEAD_SHA}^")"
            matrix="$(uv run python -m azelficoast.research.ci plan --base "${base_sha}" --head "${HEAD_SHA}")"
          else
            matrix="$(uv run python -m azelficoast.research.ci plan --base "${BASE_SHA}" --head "${HEAD_SHA}")"
          fi
          count="$(uv run python -c 'import json,sys; print(len(json.loads(sys.argv[1])["include"]))' "${matrix}")"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"

  accelerator-static:
    needs: candidate-plan
    if: needs.candidate-plan.result == 'success'
    name: strict accelerator typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Azelficoast simulator Python
        uses: ./.github/actions/setup-python-environment
        with:
          simulator: true
      - name: Type check accelerator frontier
        run: |
          uv run mypy \
            src/azelficoast/core/compiled_search.py \
            src/azelficoast/belief/showdown_packing.py \
            src/azelficoast/belief/packed_evaluator.py \
            src/azelficoast/belief/compiled_search.py

  candidate-exact:
    needs: candidate-plan
    if: needs.candidate-plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.candidate-plan.outputs.matrix) }}
    name: candidate (${{ matrix.experiment }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Azelficoast Python
        uses: ./.github/actions/setup-python-environment
        with:
          simulator: ${{ matrix.simulator }}
      - name: Restore verified pinned Pokémon Showdown
        if: matrix.showdown == true
        uses: ./.github/actions/setup-showdown
      - name: Execute and settle candidate evidence
        env:
          AZELFICOAST_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: uv run python -m azelficoast.research.ci run "${{ matrix.experiment }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: /tmp/azelficoast-research/${{ matrix.experiment }}
          if-no-files-found: error

  candidate-certify:
    needs: [candidate-plan, candidate-exact, accelerator-static]
    if: always() && needs.candidate-plan.result == 'success'
    name: certify candidate exact head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Azelficoast Python
        uses: ./.github/actions/setup-python-environment
      - name: Validate and emit exact-head certificate
        env:
          SELECTED_COUNT: ${{ needs.candidate-plan.outputs.count }}
          EXACT_RESULT: ${{ needs.candidate-exact.result }}
          ACCELERATOR_STATIC_RESULT: ${{ needs.accelerator-static.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MATRIX: ${{ needs.candidate-plan.outputs.matrix }}
        run: uv run python -m azelficoast.research.ci certify
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-research-certificate
          path: /tmp/candidate-research-certificate/certificate.json
          if-no-files-found: error

  hosted-plan:
    if: >-
      inputs.posterior_population_acquisition != true &&
      (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false)
      )
    runs-on: ubuntu-latest
    outputs:
      prepare_matrix: ${{ steps.plan.outputs.prepare_matrix }}
      prepare_count: ${{ steps.plan.outputs.prepare_count }}
      run_matrix: ${{ steps.plan.outputs.run_matrix }}
      run_count: ${{ steps.plan.outputs.run_count }}
      aggregate_matrix: ${{ steps.plan.outputs.aggregate_matrix }}
      aggregate_count: ${{ steps.plan.outputs.aggregate_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup Azelficoast Python
        uses: ./.github/actions/setup-python-environment
      - name: Select affected hosted research
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUESTED: ${{ inputs.study }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            plan="$(uv run python -m azelficoast.research.hosted plan --requested "${REQUESTED:-all}")"
          else
            plan="$(uv run python -m azelficoast.research.hosted plan --base "${BASE_SHA}" --head "${HEAD_SHA}")"
          fi
          prepare_matrix="$(uv run python -c 'import json,sys; print(json.dumps(json.loads(sys.argv[1])["prepare"], separators=(",",":")))' "${plan}")"
          run_matrix="$(uv run python -c 'import json,sys; print(json.dumps(json.loads(sys.argv[1])["run"], separators=(",",":")))' "${plan}")"
          aggregate_matrix="$(uv run python -c 'import json,sys; print(json.dumps(json.loads(sys.argv[1])["aggregate"], separators=(",",":")))' "${plan}")"
          prepare_count="$(uv run python -c 'import json,sys; print(len(json.loads(sys.argv[1])["include"]))' "${prepare_matrix}")"
          run_count="$(uv run python -c 'import json,sys; print(len(json.loads(sys.argv[1])["include"]))' "${run_matrix}")"
          aggregate_count="$(uv run python -c 'import json,sys; print(len(json.loads(sys.argv[1])["include"]))' "${aggregate_matrix}")"
          echo "prepare_matrix=${prepare_matrix}" >> "${GITHUB_OUTPUT}"
          echo "prepare_count=${prepare_count}" >> "${GITHUB_OUTPUT}"
          echo "run_matrix=${run_matrix}" >> "${GITHUB_OUTPUT}"
          echo "run_count=${run_count}" >> "${GITHUB_OUTPUT}"
          echo "aggregate_matrix=${aggregate_matrix}" >> "${GITHUB_OUTPUT}"
          echo "aggregate_count=${aggregate_count}" >> "${GITHUB_OUTPUT}"

  posterior-population-acquisition-generate:
    if: github.event_name == 'workflow_dispatch' && inputs.posterior_population_acquisition == true
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: sha256:${{ steps.upload.outputs.artifact-digest }}
      artifact_name: posterior-population-source-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Setup Azelficoast Python
        uses: ./.github/actions/setup-python-environment
      - name: Restore verified pinned Pokémon Showdown
        uses: ./.github/actions/setup-showdown
      - name: Generate 3,072 fresh local Random Battles
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m azelficoast.research.posterior_population_acquisition \
            generate-source \
            --output-root /tmp/posterior-population-source \
            --run-id "$GITHUB_RUN_ID" \
            --head-sha "$GITHUB_SHA" \
            --showdown-root /tmp/pokemon-showdown
      - name: Stage every available source file
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source_root=/tmp/posterior-population-source
          upload_root=/tmp/posterior-population-source-upload
          mkdir -p "$upload_root"
          if [[ -f "$source_root/acquisition-status.json" ]]; then
            cp "$source_root/acquisition-status.json" "$upload_root/acquisition-status.json"
            jq 'if .status == "started" then .status = "negative" | .failure = "generation did not complete" else . end' \
              "$upload_root/acquisition-status.json" > "$upload_root/acquisition-status.json.tmp"
            mv "$upload_root/acquisition-status.json.tmp" "$upload_root/acquisition-status.json"
          else
            jq -n \
              --argjson workflow_run_id "$GITHUB_RUN_ID" \
              --arg head_sha "$GITHUB_SHA" \
              '{status:"negative",workflow_run_id:$workflow_run_id,head_sha:$head_sha,failure:"generation did not start"}' \
              > "$upload_root/acquisition-status.json"
          fi
          for filename in decisions.jsonl corpus.jsonl source-metadata.json; do
            if [[ -f "$source_root/$filename" ]]; then
              cp "$source_root/$filename" "$upload_root/$filename"
            fi
          done
      - name: Upload immutable generated source
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posterior-population-source-${{ github.run_id }}
          path: /tmp/posterior-population-source-upload
          if-no-files-found: error
          retention-days: 90

  posterior-population-acquisition-validate:
    needs: posterior-population-acquisition-generate
    if: always() && github.event_name == 'workflow_dispatch' && inputs.posterior_population_acquisition == true
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Initialize validation receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/posterior-population-validation/selected
          jq -n \
            '{schema:"azelficoast.posterior-population-acquisition-receipt/v1", status:"negative", selected_fixture_ids:[], selected_count:0, required_minimum:100, maximum_selected_states:128, selector_exit_code:1, study_positive:false, failure_reason:"validation did not complete"}' \
            > /tmp/posterior-population-validation/receipt.json
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Setup Azelficoast Python
        uses: ./.github/actions/setup-python-environment
      - name: Restore verified pinned Pokémon Showdown
        uses: ./.github/actions/setup-showdown
      - name: Download exact generated source artifact
        if: needs.posterior-population-acquisition-generate.outputs.artifact_id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.posterior-population-acquisition-generate.outputs.artifact_id }}
          path: /tmp/posterior-population-validation/source
      - name: Verify source artifact identity
        if: needs.posterior-population-acquisition-generate.outputs.artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.posterior-population-acquisition-generate.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.posterior-population-acquisition-generate.outputs.artifact_digest }}
          ARTIFACT_NAME: ${{ needs.posterior-population-acquisition-generate.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          source_root=/tmp/posterior-population-validation/source
          artifacts="$(gh api "repos/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts")"
          matches="$(jq --arg name "$ARTIFACT_NAME" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<<"$artifacts")"
          test "$matches" = 1
          actual="$(jq --arg name "$ARTIFACT_NAME" '.artifacts[] | select(.name == $name and .expired == false)' <<<"$artifacts")"
          test "$(jq -r '.id' <<<"$actual")" = "$ARTIFACT_ID"
          test "$(jq -r '.digest' <<<"$actual")" = "$ARTIFACT_DIGEST"
          test "$(jq -r '.workflow_run.id' <<<"$actual")" = "$GITHUB_RUN_ID"
          test "$(jq -r '.workflow_run.head_sha' <<<"$actual")" = "$GITHUB_SHA"
          jq -n \
            --argjson id "$ARTIFACT_ID" \
            --arg name "$ARTIFACT_NAME" \
            --arg digest "$ARTIFACT_DIGEST" \
            --argjson workflow_run_id "$GITHUB_RUN_ID" \
            --arg workflow_head_sha "$GITHUB_SHA" \
            --argjson matches "$matches" \
            '{id:$id,name:$name,digest:$digest,workflow_run_id:$workflow_run_id,workflow_head_sha:$workflow_head_sha,matches:$matches}' \
            > /tmp/posterior-population-validation/source/artifact-binding.json
          jq -e '.status == "complete"' "$source_root/acquisition-status.json"
      - name: Run the unchanged admission pipeline
        id: selection
        if: needs.posterior-population-acquisition-generate.outputs.artifact_id != ''
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m azelficoast.research.posterior_population_acquisition \
            validate-source \
            --contract experiments/data/posterior-stratified-population-contract.json \
            --source-root /tmp/posterior-population-validation/source \
            --showdown-root /tmp/pokemon-showdown \
            --output-root /tmp/posterior-population-validation
      - name: Preserve a negative receipt on earlier validation failure
        if: always()
        env:
          GENERATION_RESULT: ${{ needs.posterior-population-acquisition-generate.result }}
          SELECTION_RESULT: ${{ steps.selection.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/posterior-population-validation/selected
          receipt=/tmp/posterior-population-validation/receipt.json
          if [[ ! -f "$receipt" || "$(jq -r '.status' "$receipt")" == "negative" && "$(jq -r '.failure_reason // ""' "$receipt")" == "validation did not complete" ]]; then
            selected_dir=/tmp/posterior-population-validation/selected
            selected_ids='[]'
            if [[ -d "$selected_dir" ]]; then
              selected_ids="$(find "$selected_dir" -maxdepth 1 -type f -name '*.json' -printf '%f\n' | sed -E 's/^[0-9]+-//; s/\.json$//' | jq -R . | jq -s .)"
            fi
            selected_count="$(jq 'length' <<<"$selected_ids")"
            jq -n \
              --arg generation "$GENERATION_RESULT" \
              --arg selection "$SELECTION_RESULT" \
              --argjson selected_ids "$selected_ids" \
              --argjson selected_count "$selected_count" \
              '{schema:"azelficoast.posterior-population-acquisition-receipt/v1",status:"negative",selected_fixture_ids:$selected_ids,selected_count:$selected_count,required_minimum:100,maximum_selected_states:128,selector_exit_code:1,study_positive:false,failure_reason:("generation=" + $generation + "; selection=" + $selection)}' \
              > "$receipt"
          fi
      - name: Upload durable acquisition validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posterior-population-acquisition-${{ github.run_id }}
          path: /tmp/posterior-population-validation
          if-no-files-found: error
          retention-days: 90

  hosted-prepare:
    needs: hosted-plan
    if: needs.hosted-plan.outputs.prepare_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.hosted-plan.outputs.prepare_matrix) }}
    name: prepare (${{ matrix.study }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-python-environment
      - name: Setup canonical research evidence
        if: matrix.evidence == true
        uses: ./.github/actions/setup-research-evidence
      - name: Restore verified pinned Pokémon Showdown
        if: matrix.showdown == true
        uses: ./.github/actions/setup-showdown
      - name: Prepare hosted research inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m azelficoast.research.hosted prepare-run "${{ matrix.study }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: ${{ matrix.if_no_files }}

  hosted-run:
    needs: [hosted-plan, hosted-prepare]
    if: always() && needs.hosted-plan.result == 'success' && needs.hosted-plan.outputs.run_count != '0' && needs.hosted-prepare.result != 'failure' && needs.hosted-prepare.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.hosted-plan.outputs.run_matrix) }}
    name: hosted (${{ matrix.study }} / ${{ matrix.unit }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-python-environment
      - name: Setup canonical research evidence
        if: matrix.evidence == true
        uses: ./.github/actions/setup-research-evidence
      - name: Restore verified pinned Pokémon Showdown
        if: matrix.showdown == true
        uses: ./.github/actions/setup-showdown
      - uses: actions/download-artifact@v4
        if: matrix.prepare_artifact_name != ''
        with:
          name: ${{ matrix.prepare_artifact_name }}
          path: /tmp/hosted-preparation
      - name: Execute hosted research unit
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m azelficoast.research.hosted run-unit "${{ matrix.study }}" "${{ matrix.unit }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: ${{ matrix.if_no_files }}

  hosted-aggregate:
    needs: [hosted-plan, hosted-prepare, hosted-run]
    if: always() && needs.hosted-plan.result == 'success' && needs.hosted-plan.outputs.aggregate_count != '0' && needs.hosted-prepare.result != 'failure' && needs.hosted-prepare.result != 'cancelled' && needs.hosted-run.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.hosted-plan.outputs.aggregate_matrix) }}
    name: aggregate (${{ matrix.study }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-python-environment
      - name: Setup canonical research evidence
        if: matrix.evidence == true
        uses: ./.github/actions/setup-research-evidence
      - name: Restore verified pinned Pokémon Showdown
        if: matrix.showdown == true
        uses: ./.github/actions/setup-showdown
      - uses: actions/download-artifact@v4
        if: matrix.prepare_artifact_name != ''
        with:
          name: ${{ matrix.prepare_artifact_name }}
          path: /tmp/hosted-preparation
      - name: Prepare aggregate inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m azelficoast.research.hosted prepare-aggregate "${{ matrix.study }}"
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.download_pattern }}
          path: /tmp/exact
          merge-multiple: true
      - name: Aggregate hosted research evidence
        run: uv run python -m azelficoast.research.hosted aggregate "${{ matrix.study }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: ${{ matrix.if_no_files }}

  overcenter-settle:
    name: Overcenter project.submit
    needs: [candidate-certify]
    if: >-
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref_name, 'overcenter/candidate/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      RESEARCH_RESULT: ${{ needs.candidate-certify.result }}
    steps:
      - name: Check out exact canonical candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Wait for ordinary CI evidence
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          conclusion="missing"
          for _ in {1..60}; do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20")"
            conclusion="$(jq -r --arg sha "$GITHUB_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha)]
              | sort_by(.run_number)
              | last
              | if . == null then "missing"
                elif .status != "completed" then "pending"
                else (.conclusion // "unknown")
                end
            ' <<<"$runs")"
            if [[ "$conclusion" != "missing" && "$conclusion" != "pending" ]]; then
              break
            fi
            sleep 5
          done
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
      - name: Record exact verification result
        id: verification
        env:
          CI_RESULT: ${{ steps.ci.outputs.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="${GITHUB_REF_NAME#overcenter/candidate/}"
          test -n "$run_id"
          test "$run_id" != "$GITHUB_REF_NAME"
          read -r commit parent extra < <(git rev-list --parents -n1 "$GITHUB_SHA")
          test "$commit" = "$GITHUB_SHA"
          test -n "$parent"
          test -z "${extra:-}"
          if [[ "$RESEARCH_RESULT" == "success" && "$CI_RESULT" == "success" ]]; then
            state="verified"
            reason=""
            tree_sha="$(git rev-parse "$GITHUB_SHA^{tree}")"
          else
            state="rejected"
            reason="AZELFICOAST_CANDIDATE_VERIFICATION_FAILED"
            tree_sha=""
          fi
          mkdir -p overcenter-verification
          jq -n \
            --arg state "$state" \
            --arg run_id "$run_id" \
            --arg candidate_sha "$GITHUB_SHA" \
            --arg base_sha "$parent" \
            --arg tree_sha "$tree_sha" \
            --arg reason "$reason" \
            '{
              schema: "overcenter-source-verification/v1",
              state: $state,
              run_id: $run_id,
              candidate_sha: $candidate_sha,
              base_sha: $base_sha,
              tree_sha: (if $tree_sha == "" then null else $tree_sha end),
              reason: (if $reason == "" then null else $reason end)
            }' > overcenter-verification/source-verification.json
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Resolve trusted Overcenter runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          repository="$(python3 -c 'import json; print(json.load(open(".overcenter/runtime.json"))["repository"])')"
          sha="$(python3 -c 'import json; print(json.load(open(".overcenter/runtime.json"))["sha"])')"
          [[ "$repository" =~ ^[^/]+/[^/]+$ ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out exact Overcenter runtime
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.runtime.outputs.repository }}
          ref: ${{ steps.runtime.outputs.sha }}
          path: .overcenter-runtime
          persist-credentials: false
      - name: Use Overcenter pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .overcenter-runtime/.node-version
          package-manager-cache: false
      - name: Settle exact candidate
        id: submit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OVERCENTER_COMMAND_REPOSITORY_ID: ${{ github.repository_id }}
          OVERCENTER_COMMAND_REPOSITORY: ${{ github.repository }}
          OVERCENTER_COMMAND_SOURCE_SHA: ${{ steps.runtime.outputs.sha }}
          OVERCENTER_COMMAND_RUN_ID: ${{ github.run_id }}
          OVERCENTER_COMMAND_RUN_ATTEMPT: ${{ github.run_attempt }}
          OVERCENTER_CANDIDATE_SHA: ${{ github.sha }}
          OVERCENTER_CANDIDATE_RUN_ID: ${{ steps.verification.outputs.run_id }}
          OVERCENTER_SOURCE_VERIFICATION_PATH: ${{ github.workspace }}/overcenter-verification/source-verification.json
          OVERCENTER_PROJECT_AUTHORITY_REF: refs/overcenter/state
          OVERCENTER_PROJECT_REMOTE: origin
        run: |
          mkdir -p overcenter-submit
          node --experimental-strip-types \
            .overcenter-runtime/src/cli/project-submit.ts \
            --receipt overcenter-submit/receipt.json
      - name: Publish settlement receipt
        uses: actions/upload-artifact@v4
        with:
          name: overcenter-project-submit-${{ steps.verification.outputs.run_id }}
          path: overcenter-submit/receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Re-enter project loop after rejected candidate
        if: steps.submit.outputs.disposition == 'READY'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/dispatches" \
            -f event_type=overcenter-advance
