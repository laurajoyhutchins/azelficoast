# Candidate-only hosted evidence; ordinary PR edits run ci.yml only.
name: natural-population-strategy-fusion

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "experiments/natural-population-strategy-fusion-plan.json"
      - "experiments/showdown-revision.txt"
      - "src/azelficoast/research/population.py"
      - "src/azelficoast/research/natural_disagreements.py"
      - "src/azelficoast/search/fusion.py"
      - "src/azelficoast/live/belief.py"
      - "src/azelficoast/research/verification/real_belief_trace.py"
      - "src/azelficoast/research/hosted/**"
      - "scripts/sample_showdown_worlds.cjs"
      - "scripts/screen_public_belief_speed_forks.cjs"
      - "scripts/probe_real_belief_trace.cjs"
      - "scripts/real_belief_probe/**"
      - "scripts/json_stream_writer.cjs"
      - "experiments/opponent-policy-semantics.json"
      - "tests/test_population_study.py"
      - "tests/test_natural_disagreements.py"
      - ".github/workflows/natural-population-strategy-fusion.yml"
      - ".github/actions/setup-python-environment/action.yml"
      - ".github/actions/setup-research-evidence/action.yml"
      - "experiments/evidence/canonical-evidence.json"
      - "experiments/evidence/canonical-evidence.tar.gz"
      - ".github/actions/setup-showdown/action.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: natural-population-strategy-fusion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-research-evidence
      - uses: ./.github/actions/setup-python-environment
      - uses: ./.github/actions/setup-showdown
      - name: Execute hosted population shard
        run: uv run python -m azelficoast.research.hosted natural-population-shard "${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        with:
          name: natural-population-exact-${{ matrix.shard }}
          path: /tmp/results
          if-no-files-found: warn

  aggregate:
    needs: exact
    if: always() && needs.exact.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-environment
      - uses: ./.github/actions/setup-research-evidence
      - uses: actions/download-artifact@v4
        with:
          pattern: natural-population-exact-*
          path: /tmp/exact
          merge-multiple: true
      - name: Aggregate hosted population evidence
        run: uv run python -m azelficoast.research.hosted natural-population-aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: natural-population-strategy-fusion-results
          path: |
            /tmp/natural-population-aggregate.json
            /tmp/aggregate-output.json
          if-no-files-found: error
