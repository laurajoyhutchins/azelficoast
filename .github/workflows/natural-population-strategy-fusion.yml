# Candidate-only hosted evidence; ordinary PR edits use ci.yml only.
name: natural-population-strategy-fusion

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "experiments/natural-population-strategy-fusion-plan.json"
      - "src/azelficoast/population_study.py"
      - "src/azelficoast/natural_disagreements.py"
      - "src/azelficoast/fusion_search.py"
      - "src/azelficoast/live_belief.py"
      - "src/azelficoast/real_belief_trace.py"
      - "scripts/sample_showdown_worlds.cjs"
      - "scripts/screen_public_belief_speed_forks.cjs"
      - "scripts/probe_real_belief_trace.cjs"
      - "tests/test_population_study.py"
      - "tests/test_natural_disagreements.py"
      - ".github/workflows/natural-population-strategy-fusion.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: natural-population-strategy-fusion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  freeze-cohort:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install and test
        run: |
          python -m pip install uv==0.12.18
          uv sync --locked
          uv run pytest tests/test_population_study.py tests/test_natural_disagreements.py

      - name: Recover immutable 256-battle source population
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actual_digest="$(gh api \
            repos/${{ github.repository }}/actions/artifacts/10836574187 \
            --jq '.digest')"
          test "$actual_digest" = \
            "sha256:d0794a33b3ab585e1a68862c34507935dffec47b3573cbaeb85e77ff14a05df2"
          mkdir -p /tmp/source
          gh run download 36068967462 \
            --name live-belief-coverage \
            --dir /tmp/source
          python - <<'PY'
          import json
          from pathlib import Path

          decisions = 0
          terminals = 0
          battle_tags = set()
          with Path("/tmp/source/decisions.jsonl").open() as handle:
              for line in handle:
                  row = json.loads(line)
                  if row.get("kind") == "decision":
                      decisions += 1
                      battle_tags.add(row["battle_tag"])
                  elif row.get("kind") == "terminal":
                      terminals += 1
          assert decisions == 6485, decisions
          assert terminals == 256, terminals
          assert len(battle_tags) == 256, len(battle_tags)
          coverage = json.loads(
              Path("/tmp/source/belief-coverage.json").read_text()
          )
          assert coverage["observed_routing"]["decision_count"] == 6485
          PY

      - name: Freeze immutable decision corpus
        run: |
          uv run azelficoast corpus build \
            /tmp/source/decisions.jsonl \
            --output /tmp/corpus.jsonl \
            | tee /tmp/corpus-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("/tmp/corpus-summary.json").read_text())
          assert summary["fixture_count"] == 6485, summary
          PY

      - name: Fetch and build pinned Pokémon Showdown
        run: |
          git init /tmp/pokemon-showdown
          git -C /tmp/pokemon-showdown remote add origin \
            https://github.com/smogon/pokemon-showdown.git
          git -C /tmp/pokemon-showdown fetch --depth 1 origin \
            a5df8274e85b0889bf2a9b3422a08b39732374fc
          git -C /tmp/pokemon-showdown checkout --detach FETCH_HEAD
          npm --prefix /tmp/pokemon-showdown ci --omit=optional --no-audit --no-fund
          npm --prefix /tmp/pokemon-showdown run build

      - name: Mine preregistered persistent hidden-Choice states
        run: |
          uv run python -m azelficoast.natural_disagreements \
            /tmp/corpus.jsonl \
            --showdown-root /tmp/pokemon-showdown \
            --rounds 2048 \
            --persistent-only \
            | tee /tmp/candidates.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/candidates.json").read_text())
          assert result["fixture_count"] == 6485, result
          assert result["candidate_count"] + len(result["excluded_fixtures"]) == 6485
          assert result["persistent_only"] is True
          PY

      - name: Screen preregistered state structures
        run: |
          tail -n +2 /tmp/corpus.jsonl > /tmp/fixtures.jsonl
          node scripts/screen_public_belief_speed_forks.cjs \
            /tmp/pokemon-showdown \
            /tmp/candidates.json \
            /tmp/fixtures.jsonl \
            512 \
            > /tmp/mechanics.json
          python - <<'PY'
          import json
          from pathlib import Path
          candidates = json.loads(Path("/tmp/candidates.json").read_text())
          mechanics = json.loads(Path("/tmp/mechanics.json").read_text())
          assert mechanics["rounds"] == 512, mechanics
          assert mechanics["case_count"] == candidates["candidate_count"]
          PY

      - name: Freeze outcome-blind exact cohort
        run: |
          mkdir -p /tmp/population/selected
          uv run python -m azelficoast.population_study freeze \
            experiments/natural-population-strategy-fusion-plan.json \
            /tmp/candidates.json \
            /tmp/mechanics.json \
            /tmp/corpus.jsonl \
            --output-dir /tmp/population/selected \
            --manifest /tmp/population/manifest.json \
            | tee /tmp/population/freeze-output.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("/tmp/population/manifest.json").read_text())
          assert manifest["frozen_before_policy_values"] is True
          assert manifest["selection_uses_policy_result"] is False
          assert manifest["source_decision_state_count"] == 6485
          assert manifest["selected_count"] > 0
          print(
              "eligible=", manifest["eligible_count"],
              "selected=", manifest["selected_count"],
              "overflow=", manifest["overflow_sampling_applied"],
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: natural-population-selection
          path: |
            /tmp/corpus-summary.json
            /tmp/candidates.json
            /tmp/mechanics.json
            /tmp/population/manifest.json
            /tmp/population/selected
          if-no-files-found: error

  exact:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Recover frozen outcome-blind cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actual_digest="$(gh api \
            repos/${{ github.repository }}/actions/artifacts/10845773798 \
            --jq '.digest')"
          test "$actual_digest" = \
            "sha256:06ed24d6da7266247e7e2a1e68d5c6fd71b3d68dfa61708b604b13b5029cfaf6"
          mkdir -p /tmp/selection
          gh run download 36092751541 \
            --name natural-population-selection \
            --dir /tmp/selection
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(
              Path("/tmp/selection/population/manifest.json").read_text()
          )
          assert manifest["source_decision_state_count"] == 6485, manifest
          assert manifest["bounded_candidate_count"] == 13, manifest
          assert manifest["eligible_count"] == 10, manifest
          assert manifest["selected_count"] == 10, manifest
          assert manifest["overflow_sampling_applied"] is False, manifest
          assert manifest["frozen_before_policy_values"] is True, manifest
          assert manifest["selection_uses_policy_result"] is False, manifest
          PY
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Azelficoast
        run: |
          python -m pip install uv==0.12.18
          uv sync --locked

      - name: Fetch and build pinned Pokémon Showdown
        run: |
          git init /tmp/pokemon-showdown
          git -C /tmp/pokemon-showdown remote add origin \
            https://github.com/smogon/pokemon-showdown.git
          git -C /tmp/pokemon-showdown fetch --depth 1 origin \
            a5df8274e85b0889bf2a9b3422a08b39732374fc
          git -C /tmp/pokemon-showdown checkout --detach FETCH_HEAD
          npm --prefix /tmp/pokemon-showdown ci --omit=optional --no-audit --no-fund
          npm --prefix /tmp/pokemon-showdown run build

      - name: Execute exact shard
        env:
          SHARD: ${{ matrix.shard }}
          AZELFICOAST_ROOT_CHANCE_SAMPLES: "16"
          AZELFICOAST_CONTINUATION_CHANCE_SAMPLES: "16"
          AZELFICOAST_CHANCE_SEED_FAMILY: "0"
        run: |
          mkdir -p /tmp/results
          python - <<'PY' > /tmp/shard.tsv
          import json
          import os
          from pathlib import Path
          shard = int(os.environ["SHARD"])
          manifest = json.loads(Path("/tmp/selection/population/manifest.json").read_text())
          for row in manifest["selected"]:
              index = int(row["population_index"])
              if (index - 1) % 8 == shard:
                  print(index, row["filename"], sep="\t")
          PY

          while IFS=$'\t' read -r index filename; do
            test -n "$index" || continue
            source="/tmp/selection/population/selected/$filename"
            node scripts/probe_real_belief_trace.cjs \
              /tmp/pokemon-showdown \
              "$source" \
              > /tmp/oracle.json
            uv run python -m azelficoast.real_belief_trace \
              /tmp/oracle.json \
              > "/tmp/results/trace-$index.json"
            uv run python -m azelficoast.population_study summarize \
              "$source" \
              "/tmp/results/trace-$index.json" \
              --output "/tmp/results/summary-$index.json" \
              > /tmp/summary-output.json
            rm -f /tmp/oracle.json
          done < /tmp/shard.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: natural-population-exact-${{ matrix.shard }}
          path: /tmp/results
          if-no-files-found: warn

  aggregate:
    needs: exact
    if: always() && needs.exact.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Azelficoast
        run: |
          python -m pip install uv==0.12.18
          uv sync --locked
      - name: Recover frozen outcome-blind cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actual_digest="$(gh api \
            repos/${{ github.repository }}/actions/artifacts/10845773798 \
            --jq '.digest')"
          test "$actual_digest" = \
            "sha256:06ed24d6da7266247e7e2a1e68d5c6fd71b3d68dfa61708b604b13b5029cfaf6"
          mkdir -p /tmp/selection
          gh run download 36092751541 \
            --name natural-population-selection \
            --dir /tmp/selection
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(
              Path("/tmp/selection/population/manifest.json").read_text()
          )
          assert manifest["source_decision_state_count"] == 6485, manifest
          assert manifest["bounded_candidate_count"] == 13, manifest
          assert manifest["eligible_count"] == 10, manifest
          assert manifest["selected_count"] == 10, manifest
          assert manifest["overflow_sampling_applied"] is False, manifest
          assert manifest["frozen_before_policy_values"] is True, manifest
          assert manifest["selection_uses_policy_result"] is False, manifest
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: natural-population-exact-*
          path: /tmp/exact
          merge-multiple: true

      - name: Aggregate preregistered population endpoints
        run: |
          uv run python -m azelficoast.population_study aggregate \
            experiments/natural-population-strategy-fusion-plan.json \
            /tmp/selection/population/manifest.json \
            /tmp/exact \
            --output /tmp/natural-population-aggregate.json \
            | tee /tmp/aggregate-output.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(
              Path("/tmp/natural-population-aggregate.json").read_text()
          )
          cohort = result["cohort"]
          outcomes = result["outcomes"]
          assert cohort["source_decision_state_count"] == 6485
          assert cohort["selected_count"] > 0
          print(
              "exact_states=", cohort["selected_count"],
              "exact_battles=", cohort["exact_battle_count"],
              "positive_bias_rate=", outcomes["positive_bias_rate"],
              "policy_disagreement_rate=", outcomes["policy_disagreement_rate"],
              "mean_bias=", outcomes["mean_max_strategy_fusion_value_advantage"],
              "mean_regret=", outcomes["mean_determinization_public_regret"],
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: natural-population-strategy-fusion-results
          path: |
            /tmp/natural-population-aggregate.json
            /tmp/aggregate-output.json
          if-no-files-found: error
