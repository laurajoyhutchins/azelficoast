name: exhausted-bench-real-belief

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - ".github/actions/setup-python-environment/action.yml"
      - ".github/actions/setup-research-evidence/action.yml"
      - ".github/actions/setup-showdown/action.yml"
      - "experiments/evidence/canonical-evidence.json"
      - "experiments/evidence/canonical-evidence.tar.gz"
      - "experiments/showdown-revision.txt"
      - "scripts/probe_real_belief_trace.cjs"
      - "scripts/real_belief_probe/**"
      - "scripts/json_stream_writer.cjs"
      - "experiments/opponent-policy-semantics.json"
      - "src/azelficoast/research/hosted/**"
      - ".github/workflows/exhausted-bench-real-belief.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-environment
      - name: Resolve code-owned witness matrix
        id: matrix
        run: echo "matrix=$(uv run python -m azelficoast.research.hosted matrix exhausted-bench)" >> "${GITHUB_OUTPUT}"

  exact:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: exact-${{ matrix.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-environment
      - uses: ./.github/actions/setup-research-evidence
      - uses: ./.github/actions/setup-showdown
      - name: Execute hosted research contract
        run: uv run python -m azelficoast.research.hosted exhausted-bench "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exhausted-bench-${{ matrix.name }}
          path: |
            /tmp/source.json
            /tmp/oracle.json
            /tmp/trace.json
            /tmp/mining.json
            /tmp/result.json
          if-no-files-found: warn
