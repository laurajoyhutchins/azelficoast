name: public-belief-feasibility-search

on:
  pull_request:
    paths:
      - ".github/workflows/public-belief-feasibility-search.yml"
      - "src/azelficoast/harness.py"
      - "tests/test_instrumentation.py"
      - "src/azelficoast/instrumentation.py"
      - "src/azelficoast/corpus.py"
      - "src/azelficoast/protect_continuations.py"
      - "tests/test_corpus.py"
      - "src/azelficoast/natural_disagreements.py"
      - "scripts/screen_public_belief_speed_forks.cjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-belief-feasibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Install Azelficoast
        run: uv sync

      - name: Fetch pinned Pokémon Showdown
        run: |
          git init /tmp/pokemon-showdown
          git -C /tmp/pokemon-showdown remote add origin https://github.com/smogon/pokemon-showdown.git
          git -C /tmp/pokemon-showdown fetch --depth 1 origin a5df8274e85b0889bf2a9b3422a08b39732374fc
          git -C /tmp/pokemon-showdown checkout --detach FETCH_HEAD

      - name: Build Pokémon Showdown
        working-directory: /tmp/pokemon-showdown
        run: |
          npm ci --omit=optional --no-audit --no-fund
          cp config/config-example.js config/config.js

      - name: Start local Showdown
        working-directory: /tmp/pokemon-showdown
        run: |
          nohup node pokemon-showdown start --no-security >/tmp/showdown.log 2>&1 &
          python - <<'PY'
          import socket
          import time

          deadline = time.time() + 30
          while time.time() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 8000), timeout=1):
                      break
              except OSError:
                  time.sleep(0.25)
          else:
              raise SystemExit("Showdown did not open port 8000")
          PY

      - name: Generate 2048 real battles
        run: |
          uv run azelficoast             --results /tmp/results.jsonl             --decisions /tmp/decisions.jsonl             --replays /tmp/replays             local --battles 2048 --concurrency 8

      - name: Freeze Protect-only decision corpus
        run: |
          uv run python - <<'PY' | tee /tmp/corpus-summary.json
          import json

          from azelficoast.corpus import build_fixtures, write_corpus

          def protect_legal(state):
              return any(
                  str(action).startswith("/choose move protect")
                  for action in state.get("legal_actions", ())
              )

          fixtures = build_fixtures(
              ["/tmp/decisions.jsonl"],
              decision_predicate=protect_legal,
          )
          digest = write_corpus(fixtures, "/tmp/corpus.jsonl")
          print(json.dumps({
              "schema": "azelficoast.filtered-decision-corpus",
              "schema_version": 1,
              "filter": "protect-legal",
              "fixture_count": len(fixtures),
              "corpus_sha256": digest,
          }, sort_keys=True))
          PY

      - name: Mine Protect information sets at discovery resolution
        run: |
          uv run python -m azelficoast.protect_continuations             /tmp/corpus.jsonl             --showdown-root /tmp/pokemon-showdown             --rounds 512             | tee /tmp/protect-candidates.json

      - name: Extract speed-fork fixtures only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/protect-candidates.json").read_text())
          candidates = [
              candidate
              for candidate in result["candidates"]
              if candidate["current_speed_fork"]
          ]
          ids = {candidate["fixture_id"] for candidate in candidates}

          selected = []
          with Path("/tmp/corpus.jsonl").open() as source:
              for line in source:
                  fixture = json.loads(line)
                  if fixture.get("fixture_id") in ids:
                      selected.append(fixture)

          if len(selected) != len(ids):
              raise SystemExit(
                  f"selected {len(selected)} fixtures for {len(ids)} candidate IDs"
              )

          Path("/tmp/speed-fork-candidates.json").write_text(
              json.dumps(
                  {
                      "schema": "azelficoast.protect-speed-fork-discovery",
                      "schema_version": 1,
                      "source_fixture_count": result["source_fixture_count"],
                      "protect_fixture_count": result["protect_fixture_count"],
                      "candidate_count": result["candidate_count"],
                      "speed_fork_candidate_count": len(candidates),
                      "sampled_world_queries": result["sampled_world_queries"],
                      "sample_rounds": 512,
                      "candidates": candidates,
                  },
                  sort_keys=True,
              )
              + "\n"
          )
          with Path("/tmp/speed-fork-fixtures.jsonl").open("w") as output:
              for fixture in selected:
                  output.write(json.dumps(fixture, sort_keys=True) + "\n")

          print(
              "source_fixtures=",
              result["source_fixture_count"],
              "protect_fixtures=",
              result["protect_fixture_count"],
              "choice_candidates=",
              result["candidate_count"],
              "speed_forks=",
              len(candidates),
              "world_queries=",
              result["sampled_world_queries"],
          )
          PY

      - name: Screen speed-fork mechanics
        run: |
          node scripts/screen_public_belief_speed_forks.cjs \
            /tmp/pokemon-showdown \
            /tmp/speed-fork-candidates.json \
            /tmp/speed-fork-fixtures.jsonl \
            | tee /tmp/public-belief-speed-fork-mechanics.json

          node - <<'NODE'
          const fs = require("node:fs");
          const discovery = JSON.parse(
            fs.readFileSync("/tmp/speed-fork-candidates.json", "utf8")
          );
          const mechanics = JSON.parse(
            fs.readFileSync(
              "/tmp/public-belief-speed-fork-mechanics.json",
              "utf8"
            )
          );
          if (mechanics.case_count !== discovery.speed_fork_candidate_count) {
            throw new Error(
              `mechanics screened ${mechanics.case_count} cases for ` +
              `${discovery.speed_fork_candidate_count} speed forks`
            );
          }
          console.log(JSON.stringify({
            case_count: mechanics.case_count,
            strict_execution_fork_count:
              mechanics.strict_execution_fork_count,
            strict_execution_forks: mechanics.cases
              .filter(candidate => candidate.strict_execution_fork)
              .map(candidate => candidate.fixture_id),
          }, null, 2));
          NODE

      - name: Show local server log on failure
        if: failure()
        run: tail -200 /tmp/showdown.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: public-belief-feasibility-search
          path: |
            /tmp/corpus-summary.json
            /tmp/protect-candidates.json
            /tmp/speed-fork-candidates.json
            /tmp/speed-fork-fixtures.jsonl
            /tmp/public-belief-speed-fork-mechanics.json
          if-no-files-found: error
