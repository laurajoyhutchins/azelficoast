# Candidate-only hosted evidence; ordinary PR edits run ci.yml only.
name: natural-depth-regret

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "experiments/natural-depth-regret-plan.json"
      - "experiments/showdown-revision.txt"
      - "src/azelficoast/research/depth_population.py"
      - "src/azelficoast/research/depth.py"
      - "src/azelficoast/research/verification/real_belief_trace.py"
      - "src/azelficoast/research/hosted/**"
      - "scripts/probe_real_belief_trace.cjs"
      - "scripts/real_belief_probe/**"
      - "scripts/json_stream_writer.cjs"
      - "experiments/opponent-policy-semantics.json"
      - "tests/test_depth_population.py"
      - "tests/test_depth_study.py"
      - "tests/test_real_belief_trace.py"
      - ".github/workflows/natural-depth-regret.yml"
      - ".github/actions/setup-python-environment/action.yml"
      - ".github/actions/setup-showdown/action.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: natural-depth-regret-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-environment
      - uses: ./.github/actions/setup-showdown
      - name: Execute hosted depth shard
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m azelficoast.research.hosted natural-depth-shard "${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        with:
          name: natural-depth-regret-exact-${{ matrix.shard }}
          path: /tmp/results
          if-no-files-found: error

  aggregate:
    needs: exact
    if: always() && needs.exact.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-environment
      - name: Restore and validate frozen cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m azelficoast.research.hosted natural-depth-restore
      - uses: actions/download-artifact@v4
        with:
          pattern: natural-depth-regret-exact-*
          path: /tmp/exact
          merge-multiple: true
      - name: Aggregate hosted depth evidence
        run: uv run python -m azelficoast.research.hosted natural-depth-aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: natural-depth-regret-results
          path: |
            /tmp/natural-depth-regret-aggregate.json
            /tmp/aggregate-output.json
          if-no-files-found: error
