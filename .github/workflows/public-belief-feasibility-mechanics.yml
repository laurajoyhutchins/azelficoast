name: public-belief-feasibility-mechanics

on:
  pull_request:
    paths:
      - "scripts/screen_public_belief_speed_forks.cjs"
      - ".github/workflows/public-belief-feasibility-mechanics.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download immutable discovery evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/laurajoyhutchins/azelficoast/actions/artifacts/10826128634/zip \
            --output /tmp/discovery.zip
          echo "23d7589bde9e9399cdc07f7e9f7b2e299288508c8c35cd47dc853c1514b4d20c  /tmp/discovery.zip" \
            | sha256sum --check
          mkdir /tmp/discovery
          unzip -q /tmp/discovery.zip -d /tmp/discovery

      - name: Fetch pinned Pokémon Showdown
        run: |
          git init /tmp/pokemon-showdown
          git -C /tmp/pokemon-showdown remote add origin https://github.com/smogon/pokemon-showdown.git
          git -C /tmp/pokemon-showdown fetch --depth 1 origin a5df8274e85b0889bf2a9b3422a08b39732374fc
          git -C /tmp/pokemon-showdown checkout --detach FETCH_HEAD

      - name: Build Pokémon Showdown
        working-directory: /tmp/pokemon-showdown
        run: |
          npm ci --omit=optional --no-audit --no-fund
          npm run build

      - name: Screen ten natural speed forks
        run: |
          node scripts/screen_public_belief_speed_forks.cjs \
            /tmp/pokemon-showdown \
            /tmp/discovery/speed-fork-candidates.json \
            /tmp/discovery/speed-fork-fixtures.jsonl \
            | tee /tmp/public-belief-speed-fork-mechanics.json

          node - <<'NODE'
          const fs = require("node:fs");
          const result = JSON.parse(
            fs.readFileSync(
              "/tmp/public-belief-speed-fork-mechanics.json",
              "utf8"
            )
          );
          if (result.case_count !== 10) {
            throw new Error(`expected 10 cases, got ${result.case_count}`);
          }
          console.log(JSON.stringify({
            case_count: result.case_count,
            strict_execution_fork_count: result.strict_execution_fork_count,
            strict_execution_forks: result.cases
              .filter(candidate => candidate.strict_execution_fork)
              .map(candidate => ({
                fixture_id: candidate.fixture_id,
                active_species: candidate.active_species,
                opponent_species: candidate.opponent_species,
                locked_move: candidate.locked_move,
                item_counts: candidate.item_counts,
              })),
          }, null, 2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: public-belief-feasibility-mechanics
          path: /tmp/public-belief-speed-fork-mechanics.json
          if-no-files-found: error
