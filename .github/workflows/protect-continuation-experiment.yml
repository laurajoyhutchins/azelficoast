name: protect-continuation-experiment

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - ".github/actions/setup-python-environment/action.yml"
      - ".github/actions/setup-showdown/action.yml"
      - "experiments/showdown-revision.txt"
      - "src/azelficoast/live/harness.py"
      - "src/azelficoast/research/protect_continuations.py"
      - "src/azelficoast/research/natural_disagreements.py"
      - "src/azelficoast/research/hosted/**"
      - "tests/test_harness.py"
      - "tests/test_protect_continuations.py"
      - "tests/test_natural_disagreements.py"
      - ".github/workflows/protect-continuation-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-environment
      - uses: ./.github/actions/setup-showdown
      - name: Execute hosted research contract
        run: uv run python -m azelficoast.research.hosted protect-continuation
      - name: Show local server log on failure
        if: failure()
        run: tail -200 /tmp/showdown.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: protect-continuation-evidence
          path: |
            /tmp/results.jsonl
            /tmp/decisions.jsonl
            /tmp/corpus.jsonl
            /tmp/corpus-summary.json
            /tmp/protect-candidates.json
          if-no-files-found: error
