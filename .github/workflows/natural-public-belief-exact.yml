name: natural-public-belief-exact

on:
  pull_request:
    paths:
      - "experiments/natural-public-belief-exact-selection.json"
      - "experiments/real-belief-source-jirachi-flamigo.json"
      - "experiments/real-belief-source-tinkaton-zapdosgalar-lowhp.json"
      - "experiments/real-belief-source-tinkaton-zapdosgalar-mid.json"
      - ".github/workflows/natural-public-belief-exact.yml"
      - "scripts/probe_real_belief_trace.cjs"
      - "src/azelficoast/real_belief_trace.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: natural-public-belief-exact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact:
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: jirachi-flamigo
            rank: 1
            fixture: experiments/real-belief-source-jirachi-flamigo.json
          - case: tinkaton-zapdosgalar-lowhp
            rank: 2
            fixture: experiments/real-belief-source-tinkaton-zapdosgalar-lowhp.json
          - case: tinkaton-zapdosgalar-mid
            rank: 3
            fixture: experiments/real-belief-source-tinkaton-zapdosgalar-mid.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Install Azelficoast
        run: uv sync

      - name: Verify preregistered selection
        env:
          SOURCE_FIXTURE: ${{ matrix.fixture }}
          SELECTION_RANK: ${{ matrix.rank }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          selection = json.loads(
              Path("experiments/natural-public-belief-exact-selection.json").read_text()
          )
          source = json.loads(Path(os.environ["SOURCE_FIXTURE"]).read_text())
          rank = int(os.environ["SELECTION_RANK"])

          assert selection["bounded_treatment_count"] == 3, selection
          assert selection["source_artifact"]["artifact_id"] == 10828246332, selection
          assert (
              selection["source_artifact"]["digest"]
              == "sha256:8ebe92746f76af4a6bab60c64e40ead2a31afb7f09beb988a77d2108b9e14f94"
          ), selection
          assert source["selection_rank"] == rank, source
          assert selection["selected_fixture_ids"][rank - 1] == source["fixture_id"], (
              selection,
              source,
          )
          PY

      - name: Fetch pinned Pokémon Showdown
        run: |
          git init /tmp/pokemon-showdown
          git -C /tmp/pokemon-showdown remote add origin https://github.com/smogon/pokemon-showdown.git
          git -C /tmp/pokemon-showdown fetch --depth 1 origin a5df8274e85b0889bf2a9b3422a08b39732374fc
          git -C /tmp/pokemon-showdown checkout --detach FETCH_HEAD

      - name: Build Pokémon Showdown
        working-directory: /tmp/pokemon-showdown
        run: |
          npm ci --omit=optional --no-audit --no-fund
          npm run build

      - name: Generate exact hidden-world oracle
        env:
          SOURCE_FIXTURE: ${{ matrix.fixture }}
        run: |
          node scripts/probe_real_belief_trace.cjs \
            /tmp/pokemon-showdown \
            "$SOURCE_FIXTURE" \
            > /tmp/transition-oracle.json

      - name: Analyze public information sets
        run: |
          set -o pipefail
          uv run python -m azelficoast.real_belief_trace \
            /tmp/transition-oracle.json \
            | tee /tmp/decision-trace.json

      - name: Verify valid treatment and summarize result
        env:
          SOURCE_FIXTURE: ${{ matrix.fixture }}
          CASE_NAME: ${{ matrix.case }}
          SELECTION_RANK: ${{ matrix.rank }}
        run: |
          python - <<'PY' | tee /tmp/summary.json
          import json
          import os
          from pathlib import Path

          source = json.loads(Path(os.environ["SOURCE_FIXTURE"]).read_text())
          oracle = json.loads(Path("/tmp/transition-oracle.json").read_text())
          trace = json.loads(Path("/tmp/decision-trace.json").read_text())

          assert oracle["showdown_commit"] == source["showdown_commit"], oracle
          assert oracle["source_fixture_id"] == source["fixture_id"], oracle
          assert len(oracle["worlds"]) >= 2, oracle
          assert len(oracle["legal_actions"]) == len(source["state"]["legal_actions"]), oracle
          assert trace["schema"] == "azelficoast.real-belief-decision-trace", trace
          assert trace["schema_version"] == 3, trace
          assert trace["source_fixture_id"] == source["fixture_id"], trace
          assert trace["showdown_commit"] == source["showdown_commit"], trace
          assert trace["world_count"] == len(oracle["worlds"]), trace
          assert trace["legal_action_count"] == len(oracle["legal_actions"]), trace
          assert trace["experiment_valid"] is True, trace

          conflicted_actions = [
              row["action"]
              for row in trace["actions"]
              if row["strategy_fusion_observation_count"] > 0
          ]
          print(json.dumps({
              "case": os.environ["CASE_NAME"],
              "selection_rank": int(os.environ["SELECTION_RANK"]),
              "fixture_id": source["fixture_id"],
              "world_count": trace["world_count"],
              "legal_action_count": trace["legal_action_count"],
              "strategy_fusion_observation_count": trace[
                  "strategy_fusion_observation_count"
              ],
              "conflicted_root_actions": conflicted_actions,
              "policy_disagreement": trace["policy_disagreement"],
              "determinization_action": trace["determinization"]["chosen_action"],
              "public_belief_action": trace["public_belief"]["chosen_action"],
              "determinization_value": trace["determinization"]["value"],
              "public_belief_value": trace["public_belief"]["value"],
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: natural-public-belief-exact-${{ matrix.case }}
          path: |
            /tmp/transition-oracle.json
            /tmp/decision-trace.json
            /tmp/summary.json
          if-no-files-found: warn
