name: opponent-team-completion-support

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - ".github/actions/setup-python-environment/action.yml"
      - ".github/actions/setup-research-evidence/action.yml"
      - ".github/actions/setup-showdown/action.yml"
      - "experiments/evidence/canonical-evidence.json"
      - "experiments/evidence/canonical-evidence.tar.gz"
      - "experiments/showdown-revision.txt"
      - "scripts/enumerate_team_completion_support.cjs"
      - "src/azelficoast/research/hosted/**"
      - ".github/workflows/opponent-team-completion-support.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  enumerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-environment
      - uses: ./.github/actions/setup-research-evidence
      - uses: ./.github/actions/setup-showdown
      - name: Execute hosted research contract
        run: uv run python -m azelficoast.research.hosted opponent-team-completion-support
      - uses: actions/upload-artifact@v4
        with:
          name: opponent-team-completion-support
          path: |
            /tmp/turn12-support.json
            /tmp/turn13-support.json
          if-no-files-found: error
