name: conditional-team-prior

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "scripts/evaluate_conditional_team_prior.cjs"
      - "src/azelficoast/research/hosted/**"
      - "experiments/showdown-revision.txt"
      - ".github/actions/setup-python-environment/action.yml"
      - ".github/actions/setup-showdown/action.yml"
      - ".github/workflows/conditional-team-prior.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conditional-team-prior-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-environment
      - uses: ./.github/actions/setup-showdown
      - name: Execute hosted research contract
        run: uv run python -m azelficoast.research.hosted conditional-team-prior
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conditional-team-prior
          path: /tmp/conditional-team-prior.json
          if-no-files-found: warn
