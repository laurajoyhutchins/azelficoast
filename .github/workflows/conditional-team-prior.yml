name: conditional-team-prior

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "showdown/research/belief/evaluate_conditional_team_prior.cjs"
      - ".github/workflows/conditional-team-prior.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conditional-team-prior-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch pinned Pokémon Showdown
        run: |
          git init /tmp/pokemon-showdown
          git -C /tmp/pokemon-showdown remote add origin https://github.com/smogon/pokemon-showdown.git
          git -C /tmp/pokemon-showdown fetch --depth 1 origin a5df8274e85b0889bf2a9b3422a08b39732374fc
          git -C /tmp/pokemon-showdown checkout --detach FETCH_HEAD

      - name: Build Pokémon Showdown
        working-directory: /tmp/pokemon-showdown
        run: |
          npm ci --omit=optional --no-audit --no-fund
          npm run build

      - name: Train and evaluate hidden-slot prior
        run: |
          node showdown/research/belief/evaluate_conditional_team_prior.cjs \
            /tmp/pokemon-showdown \
            80000 10000 10000 \
            | tee /tmp/conditional-team-prior.json

      - name: Verify preregistered held-out improvement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/conditional-team-prior.json").read_text())
          uniform = result["test"]["uniform_compatible"]
          unigram = result["test"]["unigram_compatible"]
          pairwise = result["test"]["pairwise_compatible"]

          assert result["selected_lambda"] > 0, result["selected_lambda"]
          assert uniform["support_misses"] == 0, uniform
          assert unigram["support_misses"] == 0, unigram
          assert pairwise["support_misses"] == 0, pairwise

          nll_gain = unigram["mean_nll"] - pairwise["mean_nll"]
          top20_gain = pairwise["top20_recall"] - unigram["top20_recall"]

          assert pairwise["mean_nll"] < uniform["mean_nll"], {
              "uniform": uniform,
              "pairwise": pairwise,
          }
          assert nll_gain >= 0.05, {
              "unigram": unigram,
              "pairwise": pairwise,
              "nll_gain": nll_gain,
          }
          assert top20_gain >= 0.02, {
              "unigram": unigram,
              "pairwise": pairwise,
              "top20_gain": top20_gain,
          }

          print(json.dumps({
              "selected_lambda": result["selected_lambda"],
              "uniform_nll": uniform["mean_nll"],
              "unigram_nll": unigram["mean_nll"],
              "pairwise_nll": pairwise["mean_nll"],
              "nll_gain_over_unigram": nll_gain,
              "unigram_top20": unigram["top20_recall"],
              "pairwise_top20": pairwise["top20_recall"],
              "top20_gain": top20_gain,
              "pairwise_top5": pairwise["top5_recall"],
              "pairwise_top1": pairwise["top1_recall"],
              "real_fixture_support_count": (
                  result["real_staraptor_fixture"]["support_count"]
              ),
              "real_fixture_top_20": (
                  result["real_staraptor_fixture"]["top_20"]
              ),
              "evidence_sha256": result["evidence_sha256"],
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conditional-team-prior
          path: /tmp/conditional-team-prior.json
          if-no-files-found: warn
