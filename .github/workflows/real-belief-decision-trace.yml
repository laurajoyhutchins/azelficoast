name: real-belief-decision-trace

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - ".github/actions/setup-python-environment/action.yml"
      - ".github/actions/setup-showdown/action.yml"
      - "experiments/showdown-revision.txt"
      - "src/azelficoast/research/verification/real_belief_trace.py"
      - "src/azelficoast/core/whole_turn_program.py"
      - "src/azelficoast/research/verification/real_belief_miner.py"
      - "src/azelficoast/research/hosted/**"
      - "scripts/probe_real_belief_trace.cjs"
      - "experiments/real-belief-source-fixture.json"
      - "experiments/real-belief-source-gliscor-urshifu.json"
      - "experiments/real-belief-negative-corpus.json"
      - "tests/test_real_belief_trace.py"
      - "tests/test_whole_turn_program.py"
      - "tests/test_real_belief_miner.py"
      - ".github/workflows/real-belief-decision-trace.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-belief-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-environment
      - name: Test information-set machinery
        run: uv run pytest tests/test_real_belief_trace.py tests/test_real_belief_miner.py
      - uses: ./.github/actions/setup-showdown
      - name: Execute hosted research contract
        run: uv run python -m azelficoast.research.hosted real-belief-decision-trace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-belief-decision-trace
          path: |
            /tmp/real-belief-transition-oracle.json
            /tmp/whole-turn-transition-program.json
            /tmp/whole-turn-transition-verification.json
            /tmp/real-belief-decision-trace.json
            /tmp/real-belief-analysis-status
            /tmp/real-belief-trace-mining.json
          if-no-files-found: warn
