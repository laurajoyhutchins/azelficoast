name: real-belief-decision-trace

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "src/azelficoast/real_belief_trace.py"
      - "src/azelficoast/real_belief_miner.py"
      - "scripts/probe_real_belief_trace.cjs"
      - "experiments/real-belief-source-fixture.json"
      - "experiments/real-belief-source-gliscor-urshifu.json"
      - "experiments/real-belief-negative-corpus.json"
      - "tests/test_real_belief_trace.py"
      - "tests/test_real_belief_miner.py"
      - ".github/workflows/real-belief-decision-trace.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-belief-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Install Azelficoast
        run: uv sync

      - name: Test information-set machinery
        run: uv run pytest tests/test_real_belief_trace.py tests/test_real_belief_miner.py

      - name: Fetch pinned Pokémon Showdown
        run: |
          git init /tmp/pokemon-showdown
          git -C /tmp/pokemon-showdown remote add origin https://github.com/smogon/pokemon-showdown.git
          git -C /tmp/pokemon-showdown fetch --depth 1 origin a5df8274e85b0889bf2a9b3422a08b39732374fc
          git -C /tmp/pokemon-showdown checkout --detach FETCH_HEAD

      - name: Build Pokémon Showdown
        working-directory: /tmp/pokemon-showdown
        run: |
          npm ci --omit=optional --no-audit --no-fund
          npm run build

      - name: Generate real hidden-world transition oracle
        run: |
          node scripts/probe_real_belief_trace.cjs             /tmp/pokemon-showdown             experiments/real-belief-source-gliscor-urshifu.json             > /tmp/real-belief-transition-oracle.json

      - name: Analyze public information sets
        run: |
          set +e
          uv run python -m azelficoast.real_belief_trace             /tmp/real-belief-transition-oracle.json             | tee /tmp/real-belief-decision-trace.json
          echo "${PIPESTATUS[0]}" > /tmp/real-belief-analysis-status
          set -e

      - name: Mine structural candidates
        run: |
          uv run python -m azelficoast.real_belief_miner \
            /tmp/real-belief-transition-oracle.json \
            | tee /tmp/real-belief-trace-mining.json

      - name: Verify negative corpus and mining result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          oracle = json.loads(Path("/tmp/real-belief-transition-oracle.json").read_text())
          trace = json.loads(Path("/tmp/real-belief-decision-trace.json").read_text())
          mining = json.loads(Path("/tmp/real-belief-trace-mining.json").read_text())
          corpus = json.loads(
              Path("experiments/real-belief-negative-corpus.json").read_text()
          )
          case = corpus["cases"][0]
          expected = case["expected"]

          assert oracle["showdown_commit"] == case["showdown_commit"], oracle
          assert oracle["source_fixture_id"] == case["source_fixture_id"], oracle
          assert oracle["reconstruction"]["hidden_world_count"] >= 4, oracle
          assert len(oracle["legal_actions"]) == expected["legal_action_count"], oracle
          assert len(oracle["transitions"]) == (
              len(oracle["worlds"]) * expected["legal_action_count"]
          ), oracle

          assert trace["world_count"] == expected["world_count"], trace
          assert trace["legal_action_count"] == expected["legal_action_count"], trace
          assert any(
              row["dependency_signature"]["classes_out"] < trace["world_count"]
              for row in trace["actions"]
          ), trace
          protect = next(
              row for row in trace["actions"]
              if row["action"] == "/choose move protect"
          )
          assert protect["dependency_signature"]["classes_out"] < trace["world_count"], protect
          assert trace["experiment_valid"] is True, trace
          assert trace["policy_disagreement"] is expected["policy_disagreement"], trace
          assert trace["determinization"]["chosen_action"] == expected["determinization_action"], trace
          assert trace["public_belief"]["chosen_action"] == expected["public_belief_action"], trace
          assert (
              trace["strategy_fusion_observation_count"]
              == expected["strategy_fusion_observation_count"]
          ), trace
          assert Path("/tmp/real-belief-analysis-status").read_text().strip() == "0", trace

          assert mining["ranking_uses_policy_result"] is False, mining
          assert mining["evaluated_count"] == 1, mining
          assert mining["strategy_fusion_candidate_count"] == 0, mining
          assert mining["disagreement_count"] == 0, mining
          assert mining["first_strategy_fusion_candidate"] is None, mining
          assert mining["first_disagreement"] is None, mining
          assert mining["ranked_candidates"][0]["source_fixture_id"] == case["source_fixture_id"], mining
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-belief-decision-trace
          path: |
            /tmp/real-belief-transition-oracle.json
            /tmp/real-belief-decision-trace.json
            /tmp/real-belief-analysis-status
            /tmp/real-belief-trace-mining.json
          if-no-files-found: warn
