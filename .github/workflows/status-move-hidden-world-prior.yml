name: status-move-hidden-world-prior

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - ".github/actions/setup-python-environment/action.yml"
      - ".github/actions/setup-showdown/action.yml"
      - "experiments/status-move-prior-selection.json"
      - "experiments/showdown-revision.txt"
      - "scripts/sample_showdown_worlds.cjs"
      - "src/azelficoast/belief/status_move_prior.py"
      - "src/azelficoast/research/hosted/**"
      - "tests/test_status_move_prior.py"
      - ".github/workflows/status-move-hidden-world-prior.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: status-move-hidden-world-prior-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-environment
      - name: Test prior comparison
        run: uv run pytest tests/test_status_move_prior.py
      - uses: ./.github/actions/setup-showdown
      - name: Execute hosted research contract
        run: uv run python -m azelficoast.research.hosted status-move-hidden-world-prior
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: status-move-hidden-world-prior
          path: /tmp/status-move-prior-results.json
          if-no-files-found: warn
