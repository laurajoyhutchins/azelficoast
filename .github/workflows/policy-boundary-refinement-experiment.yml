# Reproduction workflow for the fixed nine-trace falsification extension.
name: policy-boundary-refinement-experiment

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - ".github/actions/setup-research-evidence/action.yml"
      - "experiments/evidence/canonical-evidence.json"
      - "experiments/evidence/canonical-evidence.tar.gz"
      - "scripts/policy_boundary_refinement_experiment.py"
      - "experiments/policy-boundary-refinement-results.json"
      - ".github/workflows/policy-boundary-refinement-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  falsification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup canonical research evidence
        uses: ./.github/actions/setup-research-evidence

      - name: Run policy-boundary refinement experiment
        run: |
          python scripts/policy_boundary_refinement_experiment.py \
            /tmp/azelficoast-evidence/policy-boundary/case-01.json \
            /tmp/azelficoast-evidence/policy-boundary/case-02.json \
            /tmp/azelficoast-evidence/policy-boundary/case-03.json \
            /tmp/azelficoast-evidence/policy-boundary/case-04.json \
            /tmp/azelficoast-evidence/policy-boundary/case-05.json \
            /tmp/azelficoast-evidence/policy-boundary/case-06.json \
            /tmp/azelficoast-evidence/policy-boundary/case-07.json \
            /tmp/azelficoast-evidence/policy-boundary/case-08.json \
            /tmp/azelficoast-evidence/policy-boundary/case-09.json \
            | tee /tmp/policy-boundary-refinement-results.json

      - name: Verify fixed evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          actual = json.loads(Path("/tmp/policy-boundary-refinement-results.json").read_text())
          expected = json.loads(Path("experiments/policy-boundary-refinement-results.json").read_text())
          assert actual == expected, (actual, expected)
          assert actual["case_count"] == 9
          assert actual["certification_errors"] == 0
          assert actual["headline_pass"] is False
          assert actual["median_fraction"] > actual["acceptance"]["median_fraction_at_most"]
          assert actual["p90_fraction"] > actual["acceptance"]["p90_fraction_at_most"]
          PY
