# Reproduction workflow for the fixed falsification extension.
name: policy-boundary-refinement-experiment

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - ".github/actions/setup-python-environment/action.yml"
      - ".github/actions/setup-research-evidence/action.yml"
      - "experiments/evidence/canonical-evidence.json"
      - "experiments/evidence/canonical-evidence.tar.gz"
      - "scripts/policy_boundary_refinement_experiment.py"
      - "experiments/policy-boundary-refinement-results.json"
      - "src/azelficoast/research/hosted/**"
      - ".github/workflows/policy-boundary-refinement-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  falsification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-environment
      - uses: ./.github/actions/setup-research-evidence
      - name: Execute hosted research contract
        run: uv run python -m azelficoast.research.hosted policy-boundary-refinement
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-boundary-refinement-results
          path: /tmp/policy-boundary-refinement-results.json
          if-no-files-found: warn
