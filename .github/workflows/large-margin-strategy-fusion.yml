name: large-margin-strategy-fusion

on:
  pull_request:
    paths:
      - "experiments/large-margin-strategy-fusion-plan.json"
      - "src/azelficoast/fusion_search.py"
      - "tests/test_fusion_search.py"
      - "src/azelficoast/natural_disagreements.py"
      - "scripts/screen_public_belief_speed_forks.cjs"
      - "scripts/probe_real_belief_trace.cjs"
      - "src/azelficoast/real_belief_trace.py"
      - ".github/workflows/large-margin-strategy-fusion.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: large-margin-strategy-fusion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Install Azelficoast
        run: uv sync

      - name: Test outcome-blind selector
        run: uv run pytest tests/test_fusion_search.py

      - name: Verify and download immutable live corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actual_digest="$(gh api \
            repos/${{ github.repository }}/actions/artifacts/10836574187 \
            --jq '.digest')"
          test "$actual_digest" = \
            "sha256:d0794a33b3ab585e1a68862c34507935dffec47b3573cbaeb85e77ff14a05df2"

          mkdir -p /tmp/source-artifact
          gh run download 36068967462 \
            --name live-belief-coverage \
            --dir /tmp/source-artifact

          test -s /tmp/source-artifact/decisions.jsonl

      - name: Fetch pinned Pokémon Showdown
        run: |
          git init /tmp/pokemon-showdown
          git -C /tmp/pokemon-showdown remote add origin \
            https://github.com/smogon/pokemon-showdown.git
          git -C /tmp/pokemon-showdown fetch --depth 1 origin \
            a5df8274e85b0889bf2a9b3422a08b39732374fc
          git -C /tmp/pokemon-showdown checkout --detach FETCH_HEAD

      - name: Build Pokémon Showdown
        working-directory: /tmp/pokemon-showdown
        run: |
          npm ci --omit=optional --no-audit --no-fund
          npm run build

      - name: Freeze broad hidden-item decision corpus
        run: |
          mkdir -p /tmp/large-margin/selected
          uv run python - <<'PY' | tee /tmp/large-margin/corpus-summary.json
          import json

          from azelficoast.corpus import build_fixtures, write_corpus

          def structurally_relevant(state):
              opponent = state.get("opponent_active")
              if not isinstance(opponent, dict):
                  return False
              if opponent.get("item") is not None:
                  return False
              actions = state.get("legal_actions", ())
              if not isinstance(actions, list) or len(actions) < 2:
                  return False
              return any(
                  str(action).startswith("/choose move protect")
                  or str(action).startswith("/choose switch ")
                  for action in actions
              )

          fixtures = build_fixtures(
              ["/tmp/source-artifact/decisions.jsonl"],
              decision_predicate=structurally_relevant,
          )
          digest = write_corpus(fixtures, "/tmp/large-margin/corpus.jsonl")
          print(json.dumps({
              "schema": "azelficoast.large-margin-source-corpus",
              "schema_version": 1,
              "fixture_count": len(fixtures),
              "corpus_sha256": digest,
          }, sort_keys=True))
          PY

      - name: Mine persistent hidden-Choice information sets
        run: |
          uv run python -m azelficoast.natural_disagreements \
            /tmp/large-margin/corpus.jsonl \
            --showdown-root /tmp/pokemon-showdown \
            --rounds 2048 \
            --persistent-only \
            | tee /tmp/large-margin/candidates.json

      - name: Measure mechanics separation without policy values
        run: |
          node scripts/screen_public_belief_speed_forks.cjs \
            /tmp/pokemon-showdown \
            /tmp/large-margin/candidates.json \
            /tmp/large-margin/corpus.jsonl \
            | tee /tmp/large-margin/mechanics.json

      - name: Freeze top six before exact policy evaluation
        run: |
          uv run python -m azelficoast.fusion_search \
            experiments/large-margin-strategy-fusion-plan.json \
            /tmp/large-margin/candidates.json \
            /tmp/large-margin/mechanics.json \
            /tmp/large-margin/corpus.jsonl \
            --output-dir /tmp/large-margin/selected \
            --manifest /tmp/large-margin/selection.json \
            | tee /tmp/large-margin/selection-stdout.json

          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(
              Path("experiments/large-margin-strategy-fusion-plan.json").read_text()
          )
          selection = json.loads(
              Path("/tmp/large-margin/selection.json").read_text()
          )

          assert selection["ranking_uses_policy_result"] is False, selection
          assert selection["selected_count"] == plan["discovery"]["top_k"] == 6, selection
          assert len(selection["selected"]) == 6, selection
          assert selection["showdown_commit"] == plan["showdown_commit"], selection

          for expected_rank, row in enumerate(selection["selected"], start=1):
              assert row["selection_rank"] == expected_rank, row
              assert (Path("/tmp/large-margin/selected") / row["filename"]).is_file(), row
          PY

      - id: matrix
        name: Export frozen exact-treatment matrix
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          selection = json.loads(
              Path("/tmp/large-margin/selection.json").read_text()
          )
          matrix = {
              "include": [
                  {
                      "rank": row["selection_rank"],
                      "fixture_id": row["fixture_id"],
                      "filename": row["filename"],
                  }
                  for row in selection["selected"]
              ]
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(
                  "matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n"
              )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: large-margin-selection
          path: |
            /tmp/large-margin/corpus-summary.json
            /tmp/large-margin/candidates.json
            /tmp/large-margin/mechanics.json
            /tmp/large-margin/selection.json
            /tmp/large-margin/selected
          if-no-files-found: error

  exact:
    needs: select
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: large-margin-selection
          path: /tmp/selection

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Install Azelficoast
        run: uv sync

      - name: Fetch pinned Pokémon Showdown
        run: |
          git init /tmp/pokemon-showdown
          git -C /tmp/pokemon-showdown remote add origin \
            https://github.com/smogon/pokemon-showdown.git
          git -C /tmp/pokemon-showdown fetch --depth 1 origin \
            a5df8274e85b0889bf2a9b3422a08b39732374fc
          git -C /tmp/pokemon-showdown checkout --detach FETCH_HEAD

      - name: Build Pokémon Showdown
        working-directory: /tmp/pokemon-showdown
        run: |
          npm ci --omit=optional --no-audit --no-fund
          npm run build

      - name: Execute exact candidate
        env:
          SOURCE_FILE: /tmp/selection/selected/${{ matrix.filename }}
          AZELFICOAST_ROOT_CHANCE_SAMPLES: "16"
          AZELFICOAST_CONTINUATION_CHANCE_SAMPLES: "16"
          AZELFICOAST_CHANCE_SEED_FAMILY: "0"
        run: |
          node scripts/probe_real_belief_trace.cjs \
            /tmp/pokemon-showdown \
            "$SOURCE_FILE" \
            > /tmp/oracle.json

          uv run python -m azelficoast.real_belief_trace \
            /tmp/oracle.json \
            > /tmp/trace.json

      - name: Measure strategy-fusion penalty after selection
        env:
          SOURCE_FILE: /tmp/selection/selected/${{ matrix.filename }}
          SELECTION_RANK: ${{ matrix.rank }}
          FIXTURE_ID: ${{ matrix.fixture_id }}
        run: |
          python - <<'PY' | tee /tmp/summary-${SELECTION_RANK}.json
          import json
          import os
          from pathlib import Path

          plan = json.loads(
              Path("experiments/large-margin-strategy-fusion-plan.json").read_text()
          )
          source = json.loads(Path(os.environ["SOURCE_FILE"]).read_text())
          oracle = json.loads(Path("/tmp/oracle.json").read_text())
          trace = json.loads(Path("/tmp/trace.json").read_text())
          rank = int(os.environ["SELECTION_RANK"])

          assert source["fixture_id"] == os.environ["FIXTURE_ID"], source
          assert source["selection"]["selection_rank"] == rank, source
          assert source["selection"]["ranking_uses_policy_result"] is False, source
          assert oracle["source_fixture_id"] == source["fixture_id"], oracle
          assert oracle["mechanics"]["root_chance_samples"] == 16, oracle["mechanics"]
          assert oracle["mechanics"]["continuation_chance_samples"] == 16, oracle["mechanics"]
          assert oracle["mechanics"]["chance_seed_family"] == 0, oracle["mechanics"]
          assert trace["experiment_valid"] is True, trace

          det_values = trace["determinization"]["root_values"]
          public_values = trace["public_belief"]["root_values"]
          assert set(det_values) == set(public_values), trace

          gaps = {
              action: float(det_values[action]) - float(public_values[action])
              for action in det_values
          }
          max_action = min(
              (
                  action
                  for action, gap in gaps.items()
                  if gap == max(gaps.values())
              ),
              default=None,
          )
          if max_action is None:
              raise AssertionError("trace has no root action values")
          max_gap = gaps[max_action]
          threshold = float(plan["exact_treatment"]["large_margin_threshold"])

          summary = {
              "schema": "azelficoast.large-margin-strategy-fusion-result",
              "schema_version": 1,
              "selection_rank": rank,
              "fixture_id": source["fixture_id"],
              "rank_key": source["selection"]["rank_key"],
              "signals": source["selection"]["signals"],
              "world_count": trace["world_count"],
              "legal_action_count": trace["legal_action_count"],
              "strategy_fusion_observation_count": trace[
                  "strategy_fusion_observation_count"
              ],
              "max_strategy_fusion_action": max_action,
              "max_strategy_fusion_value_advantage": max_gap,
              "large_margin_threshold": threshold,
              "large_margin_supported": max_gap >= threshold,
              "policy_disagreement": trace["policy_disagreement"],
              "determinization_action": trace["determinization"]["chosen_action"],
              "public_belief_action": trace["public_belief"]["chosen_action"],
          }
          print(json.dumps(summary, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: large-margin-exact-${{ matrix.rank }}
          path: |
            /tmp/oracle.json
            /tmp/trace.json
            /tmp/summary-${{ matrix.rank }}.json
          if-no-files-found: error

  aggregate:
    needs: [select, exact]
    if: always() && needs.select.result == 'success' && needs.exact.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: large-margin-selection
          path: /tmp/selection

      - uses: actions/download-artifact@v4
        with:
          pattern: large-margin-exact-*
          path: /tmp/exact
          merge-multiple: true

      - name: Aggregate without changing candidate order
        run: |
          python - <<'PY' | tee /tmp/large-margin-aggregate.json
          import json
          from pathlib import Path

          plan = json.loads(
              Path("experiments/large-margin-strategy-fusion-plan.json").read_text()
          )
          selection = json.loads(
              Path("/tmp/selection/selection.json").read_text()
          )
          rows = sorted(
              (
                  json.loads(path.read_text())
                  for path in Path("/tmp/exact").glob("summary-*.json")
              ),
              key=lambda row: row["selection_rank"],
          )

          assert len(rows) == selection["selected_count"] == 6, rows
          assert [row["selection_rank"] for row in rows] == list(range(1, 7)), rows
          assert [row["fixture_id"] for row in rows] == [
              row["fixture_id"] for row in selection["selected"]
          ], (selection, rows)

          threshold = float(plan["exact_treatment"]["large_margin_threshold"])
          best = max(
              rows,
              key=lambda row: (
                  row["max_strategy_fusion_value_advantage"],
                  -row["selection_rank"],
              ),
          )
          output = {
              "schema": "azelficoast.large-margin-strategy-fusion-aggregate",
              "schema_version": 1,
              "ranking_uses_policy_result": False,
              "treatment_count": len(rows),
              "large_margin_threshold": threshold,
              "large_margin_candidate_count": sum(
                  row["max_strategy_fusion_value_advantage"] >= threshold
                  for row in rows
              ),
              "hypothesis_supported": any(
                  row["max_strategy_fusion_value_advantage"] >= threshold
                  for row in rows
              ),
              "strategy_fusion_candidate_count": sum(
                  row["strategy_fusion_observation_count"] > 0
                  for row in rows
              ),
              "root_policy_disagreement_count": sum(
                  row["policy_disagreement"] for row in rows
              ),
              "best_measured_candidate": {
                  "selection_rank": best["selection_rank"],
                  "fixture_id": best["fixture_id"],
                  "action": best["max_strategy_fusion_action"],
                  "value_advantage": best[
                      "max_strategy_fusion_value_advantage"
                  ],
              },
              "results": rows,
          }
          print(json.dumps(output, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: large-margin-strategy-fusion-aggregate
          path: /tmp/large-margin-aggregate.json
          if-no-files-found: error
