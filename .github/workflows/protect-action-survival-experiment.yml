name: protect-action-survival-experiment

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - ".github/actions/setup-python-environment/action.yml"
      - "experiments/protect-action-survival.json"
      - "src/azelficoast/research/action_survival.py"
      - "src/azelficoast/research/mechanics/gen9_damage.py"
      - "src/azelficoast/research/hosted/**"
      - "tests/test_action_survival.py"
      - ".github/workflows/protect-action-survival-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-environment
      - name: Execute hosted research contract
        run: uv run python -m azelficoast.research.hosted protect-action-survival
      - name: Test action-survival machinery
        run: uv run pytest tests/test_action_survival.py
      - uses: actions/upload-artifact@v4
        with:
          name: protect-action-survival-evidence
          path: /tmp/protect-action-survival.json
          if-no-files-found: error
