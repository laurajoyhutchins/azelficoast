name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - 'overcenter/candidate/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  static:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'overcenter/proposal/'))
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Setup Azelficoast Python
        uses: ./.github/actions/setup-python-environment
      - name: Setup pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned JavaScript static tooling
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Verify static contract
        run: python tools/check.py static

  test:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'overcenter/proposal/'))
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Setup Azelficoast Python
        uses: ./.github/actions/setup-python-environment
      - name: Verify test contract
        run: python tools/check.py test

  mesprit-switch-canary:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 218
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Azelficoast Python
        uses: ./.github/actions/setup-python-environment
      - name: Setup pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Setup verified Pokémon Showdown
        uses: ./.github/actions/setup-showdown
      - name: Recover frozen failing Mesprit evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mesprit-canary-input
          gh run download 37713372447 \
            --name training-run-37713372447 \
            --dir /tmp/mesprit-canary-input
      - name: Verify Mesprit with existing mechanics admission
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ./.venv/bin/python tools/canary_mesprit.py \
            --artifact-dir /tmp/mesprit-canary-input \
            --showdown-root /tmp/pokemon-showdown \
            --receipt /tmp/mesprit-canary-receipt/receipt.json
      - name: Upload exact-head Mesprit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesprit-regression-canary
          path: /tmp/mesprit-canary-receipt/receipt.json
          if-no-files-found: warn
          retention-days: 30
