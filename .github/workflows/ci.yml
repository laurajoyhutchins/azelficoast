name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Azelficoast Python
        uses: ./.github/actions/setup-python-environment
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
      - name: Imperfect-information reference experiment
        run: uv run python -m azelficoast.imperfect_information
      - name: Pokémon-shaped counterexample
        run: uv run python -m azelficoast.pokemon_counterexample
      - name: Simulator dependency experiment
        run: uv run python -m azelficoast.simulator_experiment
