name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Azelficoast Python 3.11
        uses: ./.github/actions/setup-python-environment
        with:
          python-version: "3.11"
      - name: Type check static frontier
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup canonical research evidence
        uses: ./.github/actions/setup-research-evidence
      - name: Setup Azelficoast Python
        uses: ./.github/actions/setup-python-environment
      - name: Lint
        run: uv run ruff check .
      - name: Check Showdown probe syntax
        run: |
          node --check scripts/probe_real_belief_trace.cjs
          for script in scripts/real_belief_probe/*.cjs; do
            node --check "$script"
          done
          node --check scripts/probe_real_belief_worker.cjs
          node --check scripts/transition_successor_delta.cjs
      - name: Test
        run: uv run pytest
      - name: Fast hostile correctness gate
        run: uv run pytest tests/hostile -m hostile_fast
      - name: Imperfect-information reference experiment
        run: uv run python -m azelficoast.search.imperfect_information
      - name: Pokémon-shaped counterexample
        run: uv run python -m azelficoast.research.verification.pokemon_counterexample
      - name: Simulator dependency experiment
        run: uv run python -m azelficoast.research.experiments.simulator_experiment
