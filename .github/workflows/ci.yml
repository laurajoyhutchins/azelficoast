name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
      - name: Imperfect-information reference experiment
        run: uv run python -m azelficoast.imperfect_information
      - name: Pokémon-shaped counterexample
        run: uv run python -m azelficoast.pokemon_counterexample
