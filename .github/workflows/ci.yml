name: verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - 'overcenter/candidate/**'

permissions:
  contents: read

concurrency:
  group: verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository verification
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'overcenter/proposal/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Azelficoast Python
        uses: ./.github/actions/setup-python-environment
      - name: Install pinned JavaScript static tooling
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Verify repository
        run: python tools/check.py
