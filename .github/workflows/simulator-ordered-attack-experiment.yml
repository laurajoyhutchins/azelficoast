name: simulator-ordered-attack-experiment

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - ".github/actions/setup-python-environment/action.yml"
      - "src/azelficoast/gen9_ordered_attack.py"
      - "src/azelficoast/jax_gen9_ordered_attack.py"
      - "src/azelficoast/ordered_attack_belief.py"
      - "src/azelficoast/ordered_attack_compiler.py"
      - "src/azelficoast/ordered_attack_experiment.py"
      - "scripts/generate_showdown_ordered_attack_fixtures.cjs"
      - "tests/test_gen9_ordered_attack.py"
      - ".github/workflows/simulator-ordered-attack-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ordered-attack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Azelficoast Python
        uses: ./.github/actions/setup-python-environment
        with:
          simulator: "true"
      - name: Fetch pinned Pokémon Showdown
        run: |
          git init /tmp/pokemon-showdown
          git -C /tmp/pokemon-showdown remote add origin https://github.com/smogon/pokemon-showdown.git
          git -C /tmp/pokemon-showdown fetch --depth 1 origin a5df8274e85b0889bf2a9b3422a08b39732374fc
          git -C /tmp/pokemon-showdown checkout --detach FETCH_HEAD
      - name: Build Pokémon Showdown
        working-directory: /tmp/pokemon-showdown
        run: |
          npm ci --omit=optional --no-audit --no-fund
          npm run build
      - name: Generate ordered-attack oracle fixtures
        run: |
          node scripts/generate_showdown_ordered_attack_fixtures.cjs             /tmp/pokemon-showdown             > /tmp/showdown-ordered-attack-fixtures.json
      - name: Test ordered-attack reference semantics
        run: uv run pytest tests/test_gen9_ordered_attack.py
      - name: Run ordered-attack adaptive experiment
        run: |
          uv run python -m azelficoast.ordered_attack_experiment             /tmp/showdown-ordered-attack-fixtures.json             | tee /tmp/ordered-attack-experiment.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/ordered-attack-experiment.json").read_text())
          assert result["passed"] is True, result
          assert result["correctness"]["python_exact"] is True, result
          assert result["correctness"]["native_exact"] is True, result
          assert result["correctness"]["jax_exact"] is True, result
          assert result["semantics"]["tie_both_orders"] is True, result
          assert result["semantics"]["priority_overrides_speed"] is True, result
          assert result["projection"]["direct_equals_projected"] is True, result
          assert result["projection"]["missing_order_tie_changes_result"] is True, result
          assert result["projection"]["missing_secondary_roll_changes_result"] is True, result
          assert result["profile"]["effect_signature"] == result["effect_signature"], result
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ordered-attack-evidence
          path: /tmp/ordered-attack-experiment.json
          if-no-files-found: error
