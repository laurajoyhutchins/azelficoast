name: natural-status-move-public-belief

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "experiments/natural-status-move-treatment.json"
      - "src/azelficoast/status_move_treatment.py"
      - "scripts/probe_real_belief_trace.cjs"
      - "src/azelficoast/real_belief_trace.py"
      - "tests/test_status_move_treatment.py"
      - ".github/workflows/natural-status-move-public-belief.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: natural-status-move-public-belief-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  treatment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.12.18

      - name: Install Azelficoast
        run: uv sync --locked

      - name: Test treatment freezer
        run: uv run pytest tests/test_status_move_treatment.py

      - name: Verify and download corrected source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actual_digest="$(gh api             repos/${{ github.repository }}/actions/artifacts/10836574187             --jq '.digest')"
          test "$actual_digest" =             "sha256:d0794a33b3ab585e1a68862c34507935dffec47b3573cbaeb85e77ff14a05df2"

          mkdir -p /tmp/source-artifact
          gh run download 36068967462             --name live-belief-coverage             --dir /tmp/source-artifact

          test -s /tmp/source-artifact/decisions.jsonl

      - name: Freeze preregistered natural decision
        run: |
          uv run python -m azelficoast.status_move_treatment             experiments/natural-status-move-treatment.json             /tmp/source-artifact/decisions.jsonl             --output /tmp/status-source.json             | tee /tmp/status-source-summary.json

      - name: Fetch pinned Pokémon Showdown
        run: |
          git init /tmp/pokemon-showdown
          git -C /tmp/pokemon-showdown remote add origin             https://github.com/smogon/pokemon-showdown.git
          git -C /tmp/pokemon-showdown fetch --depth 1 origin             a5df8274e85b0889bf2a9b3422a08b39732374fc
          git -C /tmp/pokemon-showdown checkout --detach FETCH_HEAD

      - name: Build Pokémon Showdown
        working-directory: /tmp/pokemon-showdown
        run: |
          npm ci --omit=optional --no-audit --no-fund
          npm run build

      - name: Execute exact status-move oracle
        run: |
          node scripts/probe_real_belief_trace.cjs             /tmp/pokemon-showdown             /tmp/status-source.json             > /tmp/status-oracle.json

          uv run python -m azelficoast.real_belief_trace             /tmp/status-oracle.json             > /tmp/status-trace.json

      - name: Verify preregistered acceptance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path("/tmp/status-source.json").read_text())
          oracle = json.loads(Path("/tmp/status-oracle.json").read_text())
          trace = json.loads(Path("/tmp/status-trace.json").read_text())
          treatment = json.loads(
              Path("experiments/natural-status-move-treatment.json").read_text()
          )

          acceptance = treatment["acceptance"]
          expected_fixture = treatment["selection"]["expected_fixture_id"]
          expected_item = treatment["selection"]["plausible_items"]

          assert source["fixture_id"] == expected_fixture, source
          assert source["plausible_items"] == expected_item, source

          assert oracle["source_fixture_id"] == expected_fixture, oracle
          assert oracle["showdown_commit"] == treatment["showdown_commit"], oracle
          assert oracle["reconstruction"]["observed_opponent_moves"] == ["roost"], oracle
          assert (
              oracle["reconstruction"]["hidden_world_count"]
              >= acceptance["minimum_hidden_worlds"]
          ), oracle
          assert len(oracle["legal_actions"]) == acceptance["expected_legal_action_count"], oracle
          assert oracle["mechanics"]["opponent_response"] == "repeat observed roost", oracle
          assert {
              world["hidden"]["opponent.active.item"]
              for world in oracle["worlds"]
          } == set(expected_item), oracle

          assert trace["experiment_valid"] is True, trace
          assert trace["source_fixture_id"] == expected_fixture, trace
          assert trace["world_count"] == oracle["reconstruction"]["hidden_world_count"], trace
          assert trace["legal_action_count"] == acceptance["expected_legal_action_count"], trace
          assert trace["public_belief"]["chosen_action"] in oracle["legal_actions"], trace
          assert trace["determinization"]["chosen_action"] in oracle["legal_actions"], trace

          if acceptance["require_policy_disagreement"]:
              assert trace["policy_disagreement"] is True, trace

          print(json.dumps({
              "fixture_id": expected_fixture,
              "world_count": trace["world_count"],
              "legal_action_count": trace["legal_action_count"],
              "generator_matches": oracle["reconstruction"]["generator_matches"],
              "strategy_fusion_observation_count": trace[
                  "strategy_fusion_observation_count"
              ],
              "policy_disagreement": trace["policy_disagreement"],
              "determinization_action": trace["determinization"]["chosen_action"],
              "public_belief_action": trace["public_belief"]["chosen_action"],
              "determinization_value": trace["determinization"]["value"],
              "public_belief_value": trace["public_belief"]["value"],
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: natural-status-move-public-belief
          path: |
            /tmp/status-source.json
            /tmp/status-source-summary.json
            /tmp/status-oracle.json
            /tmp/status-trace.json
          if-no-files-found: warn
