name: Setup Azelficoast Python
description: Install the repository's pinned Python toolchain and locked dependencies.

inputs:
  simulator:
    description: Install the simulator dependency extra.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version-file: ".python-version"

    - name: Install pinned uv
      shell: bash
      run: python -m pip install uv==0.12.18

    - name: Install locked dependencies
      if: inputs.simulator != 'true'
      shell: bash
      run: uv sync --locked

    - name: Install locked simulator dependencies
      if: inputs.simulator == 'true'
      shell: bash
      run: uv sync --locked --extra simulator
