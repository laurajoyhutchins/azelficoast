[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "azelficoast"
version = "0.1.0"
description = "Competitive Pokemon battle AI research and evaluation harness"
requires-python = ">=3.11"
dependencies = [
  "poke-env==0.16.1",
]

[project.optional-dependencies]
simulator = [
  "jax==0.11.2; python_version >= '3.12'",
  "numpy==2.5.3; python_version >= '3.12'",
]

[project.scripts]
azelficoast = "azelficoast.harness:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/azelficoast"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.uv]
required-version = "==0.12.18"
