[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "azelficoast"
version = "0.1.0"
description = "Competitive Pokemon battle AI research and evaluation harness"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "poke-env==0.16.1",
]

[project.optional-dependencies]
simulator = [
  "jax==0.11.2; python_version >= '3.12'",
  "numpy==2.5.3; python_version >= '3.12'",
]

[project.scripts]
azelficoast = "azelficoast.live.harness:main"

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/azelficoast"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.uv]
required-version = ">=0.12.18,<0.13"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "RUF012"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "azelficoast.belief.battle_promotion.BattlePromotionPolicy",
  "azelficoast.belief.evaluator.BeliefEvaluatorSpec",
  "azelficoast.belief.improvement.AdmissionPolicy",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["RUF012"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "silent"
exclude = [
  "src/azelficoast/core/compiled_search.py",
  "src/azelficoast/belief/compiled_search.py",
  "src/azelficoast/belief/packed_evaluator.py",
  "src/azelficoast/belief/showdown_packing.py",
]
files = [
  # The authoritative core is checked as a package: new core modules enter strict CI automatically.
  "src/azelficoast/core",

  # Runtime semantics are package frontiers. Only modules whose implementation
  # genuinely requires the optional JAX stack are checked in the accelerator frontier.
  "src/azelficoast/search",
  "src/azelficoast/live",
  "src/azelficoast/belief",

  # Research contracts and matched experiment settlement.
  "src/azelficoast/research/contracts.py",
  "src/azelficoast/research/matched_comparison.py",
  "src/azelficoast/research/matched_search.py",
  "src/azelficoast/research/matched_population_run.py",
  "src/azelficoast/research/posterior_population_contract.py",
  "src/azelficoast/research/typed_search.py",
  "src/azelficoast/research/population_cohort.py",
]
