[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "azelficoast"
version = "0.1.0"
description = "Competitive Pokemon battle AI research and evaluation harness"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "poke-env==0.16.1",
]

[project.optional-dependencies]
simulator = [
  "jax==0.11.2; python_version >= '3.12'",
  "numpy==2.5.3; python_version >= '3.12'",
]

[project.scripts]
azelficoast = "azelficoast.harness:main"

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/azelficoast"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.uv]
required-version = ">=0.12.18,<0.13"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "silent"
files = [
  "src/azelficoast/research_contracts.py",
  "src/azelficoast/mechanics_contracts.py",
  "src/azelficoast/matched_comparison.py",
  "src/azelficoast/matched_oracle_search.py",
  "src/azelficoast/transition_program_search.py",
  "src/azelficoast/population_cohort.py",
]
